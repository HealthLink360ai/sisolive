<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SISO Live! · Precision Learning</title>
<link rel="icon" type="image/jpeg" href="assets/abbvie-flavicon.jpg" />
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.27.6/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" />
<style>

/* ============================================================
   SISO LIVE! · DESIGN SYSTEM
   Editorial-tech. Ink on cream. Serif italic accents.
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* Ink */
  --ink: #0B1320;
  --ink-2: #141C2E;
  --ink-3: #1F2940;
  --ink-soft: rgba(11,19,32,0.06);
  /* Paper */
  --paper: #F4F1EA;
  --paper-2: #EBE6D9;
  --paper-3: #FFFFFF;
  --paper-tinted: #FAF7F0;
  /* Rules */
  --rule: rgba(11,19,32,0.10);
  --rule-2: rgba(11,19,32,0.16);
  --rule-strong: rgba(11,19,32,0.28);
  /* Text */
  --text: #0B1320;
  --text-2: #4A5468;
  --text-3: #8B91A3;
  --text-on-ink: #F4F1EA;
  --text-on-ink-2: rgba(244,241,234,0.62);
  --text-on-ink-3: rgba(244,241,234,0.38);
  /* Signal */
  --teal: #15B79A;
  --teal-deep: #0E8B74;
  --teal-soft: rgba(21,183,154,0.10);
  --teal-soft-2: rgba(21,183,154,0.18);
  --gold: #C8A458;
  --gold-soft: rgba(200,164,88,0.12);
  --gold-soft-2: rgba(200,164,88,0.22);
  /* Purple · third brand color — admin/console identity + analytics 3rd series */
  --purple: #7050A0;
  --purple-deep: #5A3F84;
  --purple-soft: rgba(112,80,160,0.10);
  --purple-soft-2: rgba(112,80,160,0.20);
  --purple-on-ink: #B7A2D8;
  /* AbbVie corporate blue · signed-in top banner */
  --abbvie-blue: #030F40;
  --abbvie-blue-2: #0A1E5C;
  --abbvie-blue-line: rgba(244,241,234,0.10);
  --signal: #2D5BFF;
  --signal-soft: rgba(45,91,255,0.10);
  --warn: #B5681C;
  --warn-soft: rgba(181,104,28,0.10);
  --error: #B43A38;
  --error-soft: rgba(180,58,56,0.10);
  --positive: #2E8C5B;
  /* Type */
  --serif: 'Roboto', -apple-system, system-ui, sans-serif;
  --sans: 'Roboto', -apple-system, system-ui, sans-serif;
  --mono: 'Roboto', -apple-system, system-ui, sans-serif;
  /* Radii */
  --r-sm: 6px;
  --r: 10px;
  --r-lg: 16px;
  --r-xl: 22px;
  --r-2xl: 28px;
  /* Shadow */
  --shadow-card: 0 1px 0 rgba(11,19,32,0.04), 0 1px 2px rgba(11,19,32,0.04), 0 8px 24px -12px rgba(11,19,32,0.08);
  --shadow-lift: 0 1px 0 rgba(11,19,32,0.04), 0 4px 12px rgba(11,19,32,0.06), 0 24px 48px -16px rgba(11,19,32,0.14);
}

html, body, #root { height: 100%; width: 100%; }
body {
  font-family: var(--sans);
  background: var(--paper);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: 'ss01' on, 'cv11' on;
  letter-spacing: -0.005em;
}
button { font-family: var(--sans); cursor: pointer; border: none; outline: none; background: none; color: inherit; letter-spacing: inherit; }
input, textarea { font-family: var(--sans); outline: none; border: none; background: none; color: inherit; }
input::placeholder, textarea::placeholder { color: var(--text-3); }
::selection { background: rgba(21,183,154,0.25); color: var(--ink); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--rule-2); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--rule-strong); }

/* === Type primitives === */
.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-3);
}
.eyebrow.on-ink { color: var(--text-on-ink-2); }
.serif-italic { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }

/* === Animations === */
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.35; transform:scale(0.92); } }
@keyframes pulseDot { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
.fade-up { animation: fadeUp 0.45s cubic-bezier(.2,.7,.2,1) both; }
.fade-in { animation: fadeIn 0.35s ease both; }

/* ============================================================
   TOP NAV (shared chat + admin)
   ============================================================ */
.nav-top {
  background: var(--abbvie-blue);
  padding: 0 22px;
  display: flex; align-items: center; justify-content: space-between;
  height: 54px; flex-shrink: 0;
  border-bottom: 1px solid var(--abbvie-blue-line);
}
.nav-top-logo {
  display: flex; align-items: center; gap: 10px;
  color: var(--text-on-ink);
}
.nav-mark {
  width: 26px; height: 26px; border-radius: 7px;
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
}
.nav-org { height: 13px; display: flex; align-items: center; }
.nav-org img { height: 100%; width: auto; display: block; }
.nav-sep { width: 1px; height: 18px; background: rgba(244,241,234,0.18); }
.nav-wordmark {
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
  display: flex; align-items: baseline; gap: 6px;
}
.nav-wordmark .live {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 18px;
  color: var(--teal);
}
.nav-build {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-on-ink-3);
  padding-left: 12px;
  margin-left: 12px;
  border-left: 1px solid rgba(244,241,234,0.12);
}
.nav-links {
  display: flex; gap: 4px;
  background: rgba(244,241,234,0.06);
  border-radius: 999px;
  padding: 4px;
}
.nav-link {
  padding: 6px 16px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-on-ink-2);
  cursor: pointer;
  transition: all 0.18s ease;
  letter-spacing: -0.005em;
  white-space: nowrap;
}
.nav-link:hover { color: var(--text-on-ink); }
.nav-link.active {
  color: var(--ink);
  background: var(--paper);
  box-shadow: 0 1px 2px rgba(0,0,0,0.18);
}
.nav-right { display: flex; align-items: center; gap: 14px; }
.nav-status {
  display: flex; align-items: center; gap: 7px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--text-on-ink-2);
  padding: 4px 10px 4px 9px;
  border-radius: 999px;
  background: rgba(21,183,154,0.10);
  border: 1px solid rgba(21,183,154,0.24);
}
.nav-status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); animation: pulseDot 2s ease-in-out infinite; box-shadow: 0 0 6px rgba(21,183,154,0.6); }
.nav-user {
  display: flex; align-items: center; gap: 9px;
  font-size: 12.5px; color: var(--text-on-ink);
  padding: 4px 10px 4px 4px;
  border-radius: 999px;
  background: rgba(244,241,234,0.06);
  cursor: pointer;
  transition: background 0.15s;
}
.nav-user:hover { background: rgba(244,241,234,0.10); }
.nav-user-av {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 10.5px; font-weight: 500;
  color: var(--ink);
}

/* ============================================================
   LOGIN · editorial cream left, floating ink card right
   ============================================================ */
.login-screen {
  display: grid;
  grid-template-columns: 1.55fr 1fr;
  height: 100vh;
  background: var(--paper-tinted);
  position: relative;
  overflow: hidden;
}
.login-screen::before {
  /* soft orbit halo behind hero */
  content: '';
  position: absolute;
  top: 50%; left: 56%;
  width: 820px; height: 820px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background:
    radial-gradient(circle at 50% 50%, rgba(21,183,154,0.05) 0%, rgba(21,183,154,0) 55%),
    conic-gradient(from 200deg at 50% 50%, rgba(21,183,154,0.10), rgba(45,91,255,0.06), rgba(200,164,88,0.06), rgba(21,183,154,0.10));
  filter: blur(40px);
  opacity: 0.7;
  pointer-events: none;
}
.login-screen::after {
  /* fine orbit rings */
  content: '';
  position: absolute;
  top: 50%; left: 56%;
  width: 620px; height: 620px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1px solid rgba(21,183,154,0.18);
  box-shadow:
    inset 0 0 0 1px rgba(11,19,32,0),
    0 0 0 60px rgba(21,183,154,0.04);
  background:
    radial-gradient(circle, transparent 49%, rgba(21,183,154,0.10) 50%, transparent 51%) center/100% 100% no-repeat;
  pointer-events: none;
  opacity: 0.55;
}

/* ---- LEFT: editorial cream column ---- */
.login-left {
  position: relative;
  z-index: 2;
  padding: 40px 28px 32px 48px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  color: var(--text);
  overflow: hidden;
  min-width: 0;
}
.login-left-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px;
  min-width: 0;
  flex-wrap: wrap;
}
.login-lockup {
  display: flex; align-items: center; gap: 14px;
}
.login-lockup .org-mark {
  height: 32px;
  display: flex; align-items: center;
  padding-right: 4px;
}
.login-lockup .org-mark img {
  height: 100%;
  width: auto;
  display: block;
  mix-blend-mode: multiply;
}
.login-lockup .lockup-sep {
  width: 1px; height: 26px;
  background: var(--rule-2);
}
.login-lockup .product {
  display: flex; align-items: center; gap: 10px;
}
.login-lockup .product .mark {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 2px 12px rgba(21,183,154,0.30);
}
.login-lockup .product .wm {
  font-size: 22px; font-weight: 600; letter-spacing: -0.01em;
  display: inline-flex; align-items: baseline; gap: 4px;
}
.login-lockup .product .wm em {
  font-family: var(--serif); font-style: italic; font-weight: 400;
  font-size: 24px; color: var(--teal-deep); margin-left: 1px;
}

.login-help {
  font-family: var(--sans); font-size: 13px;
  color: var(--text-3);
  display: inline-flex; align-items: baseline; gap: 8px;
  white-space: nowrap;
  flex-shrink: 0;
}
.login-help a {
  color: var(--text);
  text-decoration: none;
  border-bottom: 1px dotted var(--rule-strong);
  font-weight: 500;
}
.login-help a:hover { border-bottom-color: var(--teal-deep); color: var(--teal-deep); }

.login-hero {
  align-self: center;
  max-width: 560px;
  padding-top: 0;
}
.login-pill {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 7px 16px 7px 14px;
  border: 1px solid var(--rule-2);
  background: rgba(255,255,255,0.6);
  border-radius: 999px;
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: -0.005em;
  color: var(--text-2);
  margin-bottom: 36px;
  backdrop-filter: blur(6px);
}
.login-pill .pulse-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--teal); animation: pulseDot 2s infinite;
  box-shadow: 0 0 8px rgba(21,183,154,0.6);
}
.login-headline {
  font-family: var(--sans);
  font-size: clamp(48px, 5.8vw, 66px);
  font-weight: 400;
  line-height: 1.06;
  letter-spacing: -0.035em;
  color: var(--ink);
  margin-bottom: 26px;
  max-width: 520px;
}
.login-headline .accent {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  color: var(--teal-deep);
  letter-spacing: -0.02em;
}
.login-sub {
  font-size: 17px;
  line-height: 1.6;
  color: var(--text-2);
  max-width: 460px;
  font-weight: 400;
  margin-bottom: 40px;
}

.login-feats {
  display: grid;
  grid-template-columns: repeat(3, minmax(120px, 1fr));
  gap: 18px;
  align-items: start;
  min-width: 0;
}
.login-feat { min-width: 0; }
.login-feat .ic {
  width: 46px; height: 46px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 14px;
  background: var(--paper-3);
  border: 1px solid var(--rule);
}
.login-feat.f-1 .ic { background: rgba(13,27,42,0.07); border-color: rgba(13,27,42,0.14); }
.login-feat.f-2 .ic { background: rgba(232,139,66,0.10); border-color: rgba(232,139,66,0.22); }
.login-feat.f-3 .ic { background: rgba(21,183,154,0.10); border-color: rgba(21,183,154,0.22); }
.login-feat h5 {
  font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
  color: var(--ink); margin-bottom: 6px;
}
.login-feat p {
  font-size: 14px; color: var(--text-2); line-height: 1.55;
}

.login-left-foot {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.04em;
  color: var(--text-3);
  padding-top: 24px;
  display: flex; align-items: center; gap: 14px;
}
.login-left-foot span { display: flex; align-items: center; gap: 6px; }
.login-left-foot .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--rule-strong); }

/* hero photo · inline at bottom of hero, beside the feature cards */
.login-bottom-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 24px;
  min-width: 0;
}
.login-hero-photo {
  width: 220px;
  max-width: 220px;
  flex-shrink: 0;
  pointer-events: none;
  align-self: end;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
}
.login-hero-photo img {
  width: 100%;
  height: auto;
  display: block;
  mask-image: linear-gradient(to bottom, transparent 0%, black 22%, black 80%, transparent 100%),
              linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 22%, black 80%, transparent 100%),
                      linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%);
  mask-composite: intersect;
  -webkit-mask-composite: source-in;
}

/* Narrow viewports · hide the photo so feats keep their room */
@media (max-width: 1180px) {
  .login-bottom-row { grid-template-columns: 1fr; }
  .login-hero-photo { display: none; }
}

/* ---- AbbVie bot · stands in the gap between hero text and the sign-in card ---- */
.login-bot {
  position: absolute;
  z-index: 4;
  bottom: 0;
  right: calc(43% - var(--login-bot-nudge, 5px));
  width: min(clamp(220px, 26vw, 300px), 38vh);
  pointer-events: none;
  filter: drop-shadow(0 14px 16px rgba(11,19,32,0.18));
  animation: botFloat 5.5s ease-in-out infinite;
  will-change: transform;
}
.login-bot img { width: 100%; height: auto; display: block; mix-blend-mode: multiply; }
@keyframes botFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-9px); }
}
@media (max-width: 1100px) {
  .login-bot { display: none; }
}

/* ---- RIGHT: floating dark form card ---- */
.login-right {
  position: relative;
  z-index: 3;
  padding: 32px 36px 32px 0;
  display: flex; flex-direction: column;
  align-items: stretch;
  justify-content: center;
}
.login-card {
  background: var(--ink);
  color: var(--text-on-ink);
  border-radius: 22px;
  padding: var(--login-card-pad, 44px) var(--login-card-pad-x, 44px);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.04) inset,
    0 30px 80px -20px rgba(11,19,32,0.45),
    0 8px 24px -8px rgba(11,19,32,0.30);
  border: 1px solid rgba(244,241,234,0.06);
  position: relative;
  overflow: hidden;
  height: auto;
  display: flex; flex-direction: column;
}
.login-card::before {
  content: '';
  position: absolute;
  top: -80px; right: -80px;
  width: 280px; height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(21,183,154,0.10) 0%, transparent 65%);
  pointer-events: none;
}
.login-card-inner {
  display: flex; flex-direction: column;
  flex: 1;
  position: relative; z-index: 1;
}
.login-h {
  font-family: var(--sans);
  font-size: 40px;
  font-weight: 500;
  letter-spacing: -0.035em;
  line-height: 1.05;
  color: var(--text-on-ink);
  margin-bottom: 10px;
}
.login-h em {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  color: var(--teal);
  letter-spacing: -0.025em;
}
.login-p {
  font-size: 14.5px;
  color: var(--text-on-ink-2);
  line-height: 1.55;
  margin-bottom: 32px;
}
.field { display: flex; flex-direction: column; gap: 9px; margin-bottom: var(--login-field-gap, 18px); }
.field-label {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-on-ink-2);
  display: flex; justify-content: space-between; align-items: baseline;
}
.field-label .hint {
  color: var(--text-on-ink-3);
  text-transform: none;
  letter-spacing: 0;
  font-family: var(--sans);
  font-size: 12px;
  cursor: pointer;
}
.field-label .hint:hover { color: var(--teal); }
.field-inp {
  height: 50px;
  background: rgba(244,241,234,0.04);
  border: 1px solid rgba(244,241,234,0.10);
  border-radius: 10px;
  padding: 0 16px;
  font-size: 14.5px;
  color: var(--text-on-ink);
  width: 100%;
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  letter-spacing: -0.005em;
}
.field-inp::placeholder { color: var(--text-on-ink-3); }
.field-inp:hover { border-color: rgba(244,241,234,0.18); background: rgba(244,241,234,0.06); }
.field-inp:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 4px rgba(21,183,154,0.12);
  background: rgba(244,241,234,0.06);
}

.btn-primary {
  height: 54px;
  background: var(--teal);
  color: var(--ink);
  border-radius: 10px;
  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: -0.005em;
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  transition: transform 0.1s ease, background 0.15s, box-shadow 0.15s;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.25),
    0 6px 18px -6px rgba(21,183,154,0.55);
  padding: 0 22px;
  margin-top: 0;
  margin-bottom: var(--login-field-gap, 18px);
  position: relative;
}
.btn-primary:hover:not(:disabled) { background: #1DCBA9; }
.btn-primary:active:not(:disabled) { transform: translateY(1px); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-primary .arrow {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%;
  background: rgba(11,19,32,0.92);
  color: var(--teal);
  transition: transform 0.2s ease;
}
.btn-primary:hover:not(:disabled) .arrow { transform: translateX(3px); }

.divider {
  display: flex; align-items: center; gap: 14px;
  margin: 0 0 var(--login-field-gap, 18px);
}
.divider-line { flex: 1; height: 1px; background: rgba(244,241,234,0.10); }
.divider-text {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-on-ink-3);
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.btn-sso {
  height: 50px;
  border: 1px solid rgba(244,241,234,0.16);
  border-radius: 10px;
  background: transparent;
  color: var(--text-on-ink);
  font-size: 14px;
  font-weight: 500;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: background 0.15s, border-color 0.15s;
  width: 100%;
}
.btn-sso:hover { border-color: rgba(244,241,234,0.32); background: rgba(244,241,234,0.04); }

.login-error {
  font-size: 13px;
  color: #FF9F9D;
  background: rgba(180,58,56,0.12);
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid rgba(180,58,56,0.28);
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 18px;
}

.login-card-foot {
  margin-top: auto;
  padding-top: 28px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--text-on-ink-3);
  letter-spacing: 0.06em;
  display: flex; align-items: center; gap: 10px;
}
.login-card-foot .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--text-on-ink-3); opacity: 0.6; }

.login-right-foot {
  padding: 14px 8px 0;
  display: flex; justify-content: flex-end;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--text-3);
  letter-spacing: 0.04em;
}

/* ============================================================
   ONBOARDING
   ============================================================ */
.onboard-screen {
  min-height: 100vh; height: 100vh; overflow-y: auto;
  background: var(--paper);
  display: flex; flex-direction: column; align-items: center;
  padding: 48px 32px;
}
.onboard-inner { max-width: 1080px; width: 100%; }
.onboard-video-hero {
  margin-bottom: 40px;
}
.onboard-video-embed {
  border-radius: 14px;
  overflow: hidden;
  aspect-ratio: 16/9;
  background: var(--ink);
  box-shadow: 0 8px 32px rgba(11,19,32,0.18);
  margin-bottom: 12px;
}
.onboard-video-embed iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}
.onboard-video-caption {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.05em;
  color: var(--text-3);
  display: flex;
  align-items: center;
  gap: 8px;
}
.onboard-si-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
  margin-bottom: 36px;
  padding-top: 4px;
}
.onboard-si-section { min-width: 0; }
.onboard-si-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--teal-deep);
  font-weight: 600;
  margin-bottom: 7px;
}
.onboard-si-heading {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-bottom: 8px;
}
.onboard-si-body {
  font-size: 13.5px;
  color: var(--text-2);
  line-height: 1.65;
}
@media (max-width: 700px) {
  .onboard-si-grid { grid-template-columns: 1fr; gap: 24px; }
}
.onboard-top {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 64px;
}
.onboard-brand { display: flex; align-items: center; gap: 10px; }
.onboard-brand .mark {
  width: 28px; height: 28px; border-radius: 7px;
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
  color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
}
.onboard-brand .name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.onboard-brand .name em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--teal-deep); margin-left: 1px; }
.onboard-skip-link {
  font-family: var(--mono); font-size: 11px;
  color: var(--text-2); cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px;
  transition: background 0.15s;
}
.onboard-skip-link:hover { background: var(--ink-soft); color: var(--text); }

.onboard-hero { margin-bottom: 36px; }
.onboard-eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 10px;
}
.onboard-eyebrow .step {
  background: var(--ink); color: var(--paper);
  padding: 2px 8px; border-radius: 4px;
  font-size: 10px; letter-spacing: 0.12em;
}
.onboard-h {
  font-size: 44px;
  line-height: 1.08;
  font-weight: 500;
  letter-spacing: -0.025em;
  margin-bottom: 16px;
  max-width: 620px;
}
.onboard-h em { font-family: var(--serif); font-style: italic; font-weight: 400; }
.onboard-p {
  font-size: 15.5px;
  color: var(--text-2);
  line-height: 1.55;
  max-width: 540px;
}

/* video card */
.video-box {
  position: relative;
  border-radius: var(--r-xl);
  overflow: hidden;
  background: var(--ink);
  color: var(--text-on-ink);
  cursor: pointer;
  margin-bottom: 28px;
  border: 1px solid var(--rule-2);
  box-shadow: var(--shadow-lift);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.video-box:hover { transform: translateY(-2px); }
.video-thumb {
  aspect-ratio: 16 / 9;
  background:
    radial-gradient(ellipse at 30% 40%, rgba(21,183,154,0.18) 0%, transparent 50%),
    radial-gradient(ellipse at 75% 70%, rgba(200,164,88,0.10) 0%, transparent 50%),
    var(--ink);
  position: relative;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.video-thumb::before {
  content: ''; position: absolute; inset: 0;
  background-image: radial-gradient(rgba(244,241,234,0.05) 1px, transparent 1px);
  background-size: 20px 20px;
  mask-image: linear-gradient(180deg, transparent 0%, black 40%, black 60%, transparent 100%);
}
.video-play {
  width: 84px; height: 84px; border-radius: 50%;
  background: rgba(244,241,234,0.05);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(244,241,234,0.20);
  display: flex; align-items: center; justify-content: center;
  position: relative;
  transition: transform 0.2s ease;
}
.video-box:hover .video-play { transform: scale(1.05); }
.video-play::before {
  content: ''; position: absolute; inset: -8px;
  border-radius: 50%;
  border: 1px solid rgba(21,183,154,0.30);
}
.video-play-inner {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--teal);
  color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px rgba(21,183,154,0.40);
}
.video-duration {
  position: absolute; top: 18px; left: 18px;
  font-family: var(--mono); font-size: 10.5px;
  color: var(--text-on-ink-2);
  background: rgba(11,19,32,0.5); backdrop-filter: blur(8px);
  padding: 4px 10px; border-radius: 999px;
  border: 1px solid rgba(244,241,234,0.10);
  letter-spacing: 0.08em;
}
.video-tag {
  position: absolute; top: 18px; right: 18px;
  font-family: var(--mono); font-size: 10.5px;
  color: var(--teal);
  background: rgba(21,183,154,0.10); backdrop-filter: blur(8px);
  padding: 4px 10px; border-radius: 999px;
  border: 1px solid rgba(21,183,154,0.30);
  letter-spacing: 0.08em;
  display: flex; align-items: center; gap: 6px;
}
.video-meta-bar {
  padding: 18px 22px;
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid rgba(244,241,234,0.08);
}
.video-meta-title {
  font-size: 15px; font-weight: 500; color: var(--text-on-ink);
  display: flex; align-items: center; gap: 10px;
}
.video-meta-title em { font-family: var(--serif); font-style: italic; font-weight: 400; }
.video-meta-sub { font-family: var(--mono); font-size: 11px; color: var(--text-on-ink-3); letter-spacing: 0.06em; margin-top: 4px; }
.video-skip {
  font-family: var(--mono); font-size: 11px;
  color: var(--text-on-ink-2);
  cursor: pointer;
  padding: 6px 12px; border-radius: 999px;
  border: 1px solid rgba(244,241,234,0.16);
  transition: background 0.15s;
}
.video-skip:hover { background: rgba(244,241,234,0.08); }

.onboard-cards {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  margin-bottom: 36px;
}
.onboard-card {
  padding: 22px;
  background: var(--paper-3);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  position: relative; overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.onboard-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); }
.onboard-card .num {
  position: absolute; top: 18px; right: 22px;
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--text-3);
}
.onboard-card .ic {
  width: 36px; height: 36px; border-radius: 9px;
  background: var(--abbvie-blue); color: var(--teal);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 18px;
}
.onboard-card h4 {
  font-size: 16px; font-weight: 500;
  margin-bottom: 6px;
  letter-spacing: -0.01em;
}
.onboard-card h4 em { font-family: var(--serif); font-style: italic; font-weight: 400; }
.onboard-card p { font-size: 13px; color: var(--text-2); line-height: 1.55; }

.onboard-cta-row {
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 24px; border-top: 1px solid var(--rule);
}
.onboard-cta-meta { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.onboard-cta-meta b { font-weight: 500; color: var(--text); }

/* ---- Video modal overlay ---- */
.video-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(11,19,32,0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.2s ease;
}
.video-modal-wrap {
  position: relative;
  width: min(900px, 92vw);
  aspect-ratio: 16/9;
}
.video-modal-wrap iframe {
  width: 100%;
  height: 100%;
  border: 0;
  border-radius: 14px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.55);
}
.video-modal-close {
  position: absolute;
  top: -44px;
  right: 0;
  width: 34px; height: 34px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.18);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.15s;
}
.video-modal-close:hover { background: rgba(255,255,255,0.22); }

/* ============================================================
   CHAT
   ============================================================ */
.app-shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.chat-screen { display: grid; grid-template-columns: 300px 1fr 300px; flex: 1; overflow: hidden; background: var(--paper); }
.sidebar {
  border-right: 1px solid var(--rule);
  display: flex; flex-direction: column;
  background: var(--paper-tinted);
  overflow: hidden;
}
.sidebar-top {
  padding: 18px 18px 16px;
  border-bottom: 1px solid var(--rule);
}
.new-conv-btn {
  width: 100%;
  height: 38px;
  background: var(--paper-3);
  border: 1px solid var(--rule-2);
  border-radius: var(--r);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px 0 14px;
  font-size: 13px;
  color: var(--text);
  font-weight: 500;
  transition: border-color 0.15s, background 0.15s;
}
.new-conv-btn:hover { border-color: var(--ink); background: var(--paper-3); }
.new-conv-btn .kbd {
  font-family: var(--mono); font-size: 10px;
  color: var(--text-3);
  padding: 2px 6px; border-radius: 4px;
  border: 1px solid var(--rule-2);
}
.sidebar-body {
  flex: 1; padding: 14px 12px; overflow-y: auto;
  display: flex; flex-direction: column;
}
.sidebar-sec {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 14px 8px 8px;
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-sec .cnt {
  font-family: var(--mono); font-size: 10px;
  color: var(--text-3);
  padding: 1px 6px; border-radius: 999px;
  border: 1px solid var(--rule);
  letter-spacing: 0;
  background: var(--paper-3);
}
.sidebar-item {
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-2);
  cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  transition: background 0.12s, color 0.12s;
  position: relative;
}
.sidebar-item:hover { background: var(--ink-soft); color: var(--text); }
.sidebar-item.active {
  background: var(--ink); color: var(--text-on-ink);
}
.sidebar-item.active .si-ic { color: var(--teal); }
.sidebar-item.active .si-meta { color: var(--text-on-ink-3); }
.si-ic { width: 15px; height: 15px; flex-shrink: 0; }
.si-meta {
  margin-left: auto;
  font-family: var(--mono); font-size: 10px;
  color: var(--text-3);
}

.sidebar-chips { display: flex; flex-direction: column; gap: 6px; padding: 4px 0; }
.sidebar-chip {
  padding: 12px 14px;
  border: 1px solid var(--rule);
  background: var(--paper-3);
  border-radius: 10px;
  font-size: 14px;
  color: var(--text);
  cursor: pointer;
  line-height: 1.5;
  transition: background 0.12s, border-color 0.12s, transform 0.12s;
  display: flex; gap: 8px; align-items: flex-start;
  letter-spacing: -0.005em;
}
.sidebar-chip:hover { border-color: var(--ink); transform: translateX(2px); }
.sidebar-chip .chip-mark {
  font-family: var(--mono); font-size: 10px; color: var(--text-3); flex-shrink: 0; padding-top: 1px;
}

.sidebar-footer {
  padding: 14px 18px;
  border-top: 1px solid var(--rule);
  display: flex; align-items: center; gap: 11px;
  background: var(--paper-3);
}
.user-av-side {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--ink); color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  flex-shrink: 0;
  position: relative;
}
.user-av-side::after {
  content: ''; position: absolute; bottom: 0; right: 0;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--teal);
  border: 2px solid var(--paper-3);
}
.user-info-side { flex: 1; min-width: 0; }
.user-info-side .n { font-size: 13px; font-weight: 500; color: var(--text); letter-spacing: -0.005em; }
.user-info-side .r { font-family: var(--mono); font-size: 10px; color: var(--text-3); letter-spacing: 0.04em; }
.user-info-side .chev { color: var(--text-3); }

/* chat area */
.chat-area { display: flex; flex-direction: column; background: var(--paper); overflow: hidden; }
.chat-topbar {
  padding: 14px 28px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
  border-bottom: 1px solid var(--rule);
  background: var(--paper);
  gap: 16px;
  min-width: 0;
}
.chat-topbar-left { min-width: 0; flex-shrink: 1; overflow: hidden; }
.chat-topbar-left-row { display: flex; align-items: center; gap: 12px; flex-shrink: 1; min-width: 0; }
.chat-topbar-title {
  font-size: 14.5px; font-weight: 500; color: var(--text);
  display: flex; align-items: center; gap: 10px;
  white-space: nowrap;
}
.chat-topbar-title em { font-family: var(--serif); font-style: italic; font-weight: 400; }
.chat-topbar-meta {
  font-family: var(--mono); font-size: 11px;
  color: var(--text-3);
  padding-left: 12px;
  border-left: 1px solid var(--rule);
  white-space: nowrap;
}
.verified-badge {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text);
  background: var(--paper-3);
  border: 1px solid var(--rule-2);
  padding: 5px 12px;
  border-radius: 999px;
  letter-spacing: 0.02em;
  white-space: nowrap;
  flex-shrink: 0;
}
.verified-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--teal);
  box-shadow: 0 0 8px rgba(21,183,154,0.6);
}
.chat-actions { display: flex; gap: 6px; }
.chat-action-btn {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2);
  border: 1px solid transparent;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.chat-action-btn:hover { background: var(--paper-3); border-color: var(--rule-2); color: var(--text); }

.messages {
  flex: 1; overflow-y: auto;
  padding: 28px 28px 12px;
  display: flex; flex-direction: column; gap: 24px;
}
.messages-inner { max-width: 760px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 24px; }

/* AI message */
.msg-ai { animation: fadeUp 0.4s cubic-bezier(.2,.7,.2,1) both; }
.msg-ai-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 8px;
  padding-left: 4px;
}
.msg-ai-av {
  width: 26px; height: 26px; border-radius: 7px;
  background: var(--ink); color: var(--teal);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
}
.msg-ai-name { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.msg-ai-name em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--teal-deep); margin-left: 1px; }
.msg-ai-time { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); letter-spacing: 0.04em; }
.msg-ai-time::before { content: '·'; margin: 0 8px; color: var(--text-3); }

.ai-card {
  background: var(--paper-3);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}
.ai-card-body {
  padding: 20px 22px 18px;
  font-size: 14.5px;
  line-height: 1.7;
  color: var(--text);
  letter-spacing: -0.005em;
}
.ai-card-body.parsed { display: flex; flex-direction: column; gap: 13px; padding: 20px 22px 18px; }
.ai-card-body.low-conf { color: var(--text-2); font-size: 14.5px; line-height: 1.7; }
.ai-card-body strong { font-weight: 600; }
.answer-p { font-size: 14.5px; line-height: 1.7; color: var(--text); letter-spacing: -0.005em; margin: 0; }
.answer-p + .answer-p { margin-top: 2px; }
.answer-example {
  font-size: 14px;
  line-height: 1.7;
  color: var(--text);
  padding: 11px 14px 11px 15px;
  background: rgba(21,183,154,0.06);
  border-left: 2.5px solid var(--teal);
  border-radius: 0 8px 8px 0;
  letter-spacing: -0.005em;
}
.answer-example strong { font-weight: 600; }
.answer-takeaway {
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 12px 15px;
  background: linear-gradient(135deg, rgba(21,183,154,0.08) 0%, rgba(21,183,154,0.04) 100%);
  border-radius: 10px;
  border: 1px solid rgba(21,183,154,0.20);
}
.answer-takeaway-label {
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--teal-deep);
}
.answer-takeaway-text {
  font-size: 14px;
  line-height: 1.65;
  color: var(--ink);
  font-weight: 500;
  letter-spacing: -0.01em;
}
.ai-card-foot {
  border-top: 1px solid var(--rule);
  padding: 10px 14px 10px 20px;
  display: flex; align-items: center; gap: 14px;
  background: var(--paper-tinted);
  flex-wrap: wrap;
}
.conf-gauge { display: flex; align-items: center; gap: 8px; }
.conf-arc {
  width: 22px; height: 22px;
  border-radius: 50%;
  flex-shrink: 0;
  position: relative;
}
.conf-arc-inner {
  position: absolute; inset: 3px;
  border-radius: 50%;
  background: var(--paper-3);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 8.5px; font-weight: 500;
  color: var(--text);
  overflow: hidden;
}
.conf-text {
  font-family: var(--mono); font-size: 11px;
  color: var(--text-2);
  display: flex; align-items: baseline; gap: 5px;
}
.conf-text b { color: var(--text); font-weight: 500; }
.conf-text.warn b { color: var(--warn); }

.source-chip {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: 11px;
  color: var(--text-2);
  padding: 4px 10px 4px 8px;
  border-radius: 999px;
  background: var(--paper-3);
  border: 1px solid var(--rule);
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  letter-spacing: -0.005em;
}
.source-chip:hover { border-color: var(--rule-strong); background: var(--paper); }
.source-chip .doc-mark {
  width: 14px; height: 14px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3);
}
.source-chip .ext { color: var(--text-3); }

.msg-foot-meta {
  margin-left: auto;
  display: flex; align-items: center; gap: 10px;
}
.foot-meta-pill {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--text-3);
  letter-spacing: 0.02em;
}
.foot-meta-sep { color: var(--text-3); font-family: var(--mono); }

/* feedback row */
.feedback-row {
  display: flex; align-items: center; gap: 8px;
  margin-top: 10px;
  padding-left: 4px;
}
.fb-lbl {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--text-3);
  letter-spacing: 0.04em;
}
.fb-btn {
  width: 30px; height: 30px;
  border-radius: 8px;
  border: 1px solid var(--rule-2);
  background: var(--paper-3);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2);
  transition: all 0.15s;
}
.fb-btn:hover { border-color: var(--ink); color: var(--text); }
.fb-btn.up-on {
  background: var(--teal-soft);
  border-color: var(--teal);
  color: var(--teal-deep);
}
.fb-btn.dn-on {
  background: var(--error-soft);
  border-color: var(--error);
  color: var(--error);
}
.fb-thanks {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--teal-deep);
  display: inline-flex; align-items: center; gap: 6px;
  animation: fadeIn 0.25s ease;
}
.fb-comment-box {
  margin-top: 10px;
  padding-left: 4px;
  animation: fadeUp 0.25s ease;
}
.fb-comment-box textarea {
  width: 100%;
  max-width: 460px;
  border: 1px solid var(--rule-2);
  border-radius: var(--r);
  padding: 12px 14px;
  font-size: 13px;
  color: var(--text);
  background: var(--paper-3);
  resize: none; height: 72px;
  transition: border-color 0.15s, box-shadow 0.15s;
  line-height: 1.5;
}
.fb-comment-box textarea:focus { border-color: var(--ink); box-shadow: 0 0 0 4px rgba(11,19,32,0.06); }
.fb-submit {
  margin-top: 8px;
  padding: 7px 16px;
  border-radius: 999px;
  background: var(--abbvie-blue); color: var(--paper);
  font-size: 12px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
}
.fb-submit:hover { background: var(--abbvie-blue-2); }

/* nudge · warm/gold */
.nudge {
  margin-top: 10px;
  padding: 11px 14px 11px 12px;
  border: 1px solid var(--gold-soft-2);
  border-left: 3px solid var(--gold);
  background: var(--gold-soft);
  border-radius: var(--r);
  font-size: 13px;
  color: var(--text);
  display: flex; align-items: center; gap: 10px;
  cursor: pointer;
  transition: background 0.15s;
  line-height: 1.5;
}
.nudge:hover { background: rgba(200,164,88,0.16); }
.nudge-ic {
  width: 18px; height: 18px;
  color: var(--gold);
  flex-shrink: 0;
}
.nudge em { font-family: var(--serif); font-style: italic; font-weight: 400; }
.nudge .arr {
  margin-left: auto;
  font-family: var(--mono); font-size: 10.5px;
  color: var(--text-2);
  letter-spacing: 0.04em;
}

/* escalate · supportive blue */
.escalate-card {
  margin-top: 10px;
  padding: 14px 16px;
  border: 1px solid var(--rule);
  background: var(--paper-3);
  border-radius: var(--r-lg);
  display: flex; align-items: flex-start; gap: 12px;
}
.escalate-ic {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--signal-soft); color: var(--signal);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.escalate-body { flex: 1; }
.escalate-title { font-size: 13px; font-weight: 600; letter-spacing: -0.005em; margin-bottom: 3px; }
.escalate-title em { font-family: var(--serif); font-style: italic; font-weight: 400; }
.escalate-desc { font-size: 12.5px; color: var(--text-2); line-height: 1.5; }
.escalate-btn {
  margin-left: auto; flex-shrink: 0;
  font-size: 12px; font-weight: 500;
  padding: 7px 14px;
  border-radius: 999px;
  background: var(--abbvie-blue); color: var(--paper);
  display: inline-flex; align-items: center; gap: 6px;
}
.escalate-btn:hover { background: var(--abbvie-blue-2); }

/* user message */
.msg-user {
  align-self: flex-end;
  max-width: 78%;
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  animation: fadeUp 0.4s cubic-bezier(.2,.7,.2,1) both;
}
.bubble-user {
  padding: 12px 16px;
  background: var(--abbvie-blue);
  color: var(--text-on-ink);
  border-radius: 18px 18px 6px 18px;
  font-size: 14px;
  line-height: 1.55;
  letter-spacing: -0.005em;
  box-shadow: 0 1px 2px rgba(11,19,32,0.20);
}
.msg-user-meta {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--text-3);
  padding-right: 4px;
}

/* typing */
.typing-bubble {
  display: flex; align-items: center; gap: 5px;
  padding: 18px 20px;
}
.typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); animation: pulse 1.2s infinite; }
.typing-dot:nth-child(2) { animation-delay: 0.18s; }
.typing-dot:nth-child(3) { animation-delay: 0.36s; }
.typing-label {
  font-family: var(--mono); font-size: 11px;
  color: var(--text-3);
  margin-left: 8px;
  letter-spacing: 0.04em;
}

/* ============================================================
   ASSISTANT RAIL · right side of chat · gif companion
   ============================================================ */
.chat-rail {
  border-left: 1px solid var(--rule);
  background: var(--paper-tinted);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.chat-rail-head {
  padding: 16px 20px 14px;
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.chat-rail-title {
  font-size: 14px; font-weight: 500; letter-spacing: -0.005em;
  display: flex; align-items: center; gap: 9px;
}
.chat-rail-title em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--teal-deep); }
.chat-rail-tag {
  font-family: var(--mono); font-size: 10.5px; color: var(--text-3);
  letter-spacing: 0.04em;
}
.chat-rail-body {
  flex: 1; overflow-y: auto;
  padding: 20px;
  display: flex; flex-direction: column; gap: 16px;
}

.assistant-stage {
  position: relative;
  border-radius: var(--r-lg);
  background: var(--paper-3);
  border: 1px solid var(--rule);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  aspect-ratio: 3 / 4;
  transition: filter 0.25s ease;
}
.assistant-stage.thinking {
  filter: drop-shadow(0 0 8px rgba(21,183,154,0.5));
}
.assistant-stage img.gif {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: contain;
  padding: 16px;
  box-sizing: border-box;
  display: block;
  z-index: 1;
}
.assistant-stage .stage-ph {
  position: absolute; inset: 0; z-index: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background:
    radial-gradient(ellipse at 50% 35%, rgba(21,183,154,0.10) 0%, transparent 60%),
    repeating-linear-gradient(45deg, rgba(11,19,32,0.025) 0 11px, rgba(11,19,32,0.04) 11px 22px);
  text-align: center; padding: 24px;
  overflow: hidden;
}
/* shimmer sweep — signals the slot is awaiting its animated companion */
.assistant-stage .stage-ph::after {
  content: '';
  position: absolute; inset: 0; z-index: 0;
  background: linear-gradient(105deg, transparent 38%, rgba(244,241,234,0.10) 50%, transparent 62%);
  background-size: 220% 100%;
  animation: stageShimmer 2.6s ease-in-out infinite;
  pointer-events: none;
}
@keyframes stageShimmer { 0% { background-position: 180% 0; } 100% { background-position: -80% 0; } }
.assistant-stage .stage-ph .glyph {
  position: relative; z-index: 1;
  width: 46px; height: 46px; border-radius: 12px;
  background: rgba(21,183,154,0.14); color: var(--teal);
  display: flex; align-items: center; justify-content: center;
  animation: stageBreathe 3s ease-in-out infinite;
}
@keyframes stageBreathe {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(21,183,154,0.0); }
  50% { transform: scale(1.06); box-shadow: 0 0 0 7px rgba(21,183,154,0.10); }
}
.assistant-stage .stage-ph .cap {
  position: relative; z-index: 1;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em;
  color: var(--text-2); line-height: 1.6;
}
.assistant-stage .stage-ph .cap b { color: var(--text); font-weight: 500; }
.assistant-stage .stage-ph .slot-hint {
  position: relative; z-index: 1;
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-3);
  border: 1px dashed var(--rule); border-radius: 999px;
  padding: 3px 10px;
}
@media (prefers-reduced-motion: reduce) {
  .assistant-stage .stage-ph::after,
  .assistant-stage .stage-ph .glyph { animation: none; }
}
.assistant-stage .stage-badge {
  position: absolute; left: 12px; bottom: 12px; z-index: 2;
  display: none; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.04em;
  color: var(--ink);
  background: var(--teal);
  padding: 5px 11px 5px 9px; border-radius: 999px;
  box-shadow: 0 4px 12px rgba(21,183,154,0.4);
}
.assistant-stage.thinking .stage-badge { display: inline-flex; }
.stage-badge .bdot { width: 5px; height: 5px; border-radius: 50%; background: var(--ink); animation: pulseDot 1s infinite; }

.assistant-caption {
  font-size: 12.5px; color: var(--text-2); line-height: 1.55;
}
.assistant-caption em { font-family: var(--serif); font-style: italic; font-weight: 400; }
.assistant-status {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 12px;
  border: 1px solid var(--rule);
  background: var(--paper-3);
  border-radius: var(--r);
  font-family: var(--mono); font-size: 11px; color: var(--text-2);
  letter-spacing: 0.02em;
}
.assistant-status .sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex-shrink: 0; }
.assistant-status.thinking { border-color: var(--teal-soft-2); background: var(--teal-soft); color: var(--teal-deep); }
.assistant-status.thinking .sdot { background: var(--teal); animation: pulseDot 1.2s infinite; box-shadow: 0 0 8px rgba(21,183,154,0.6); }

@media (max-width: 760px) {
  .chat-rail { display: none; }
}

/* chat input */
.chat-input-area {
  padding: 12px 28px 22px;
  flex-shrink: 0;
}
.chat-input-wrap { max-width: 760px; margin: 0 auto; width: 100%; }
.chat-input-box {
  display: flex; align-items: center; gap: 10px;
  border: 1px solid var(--rule-2);
  border-radius: 16px;
  padding: 8px 8px 8px 16px;
  background: var(--paper-3);
  transition: border-color 0.15s, box-shadow 0.15s;
  box-shadow: var(--shadow-card);
}
.chat-input-box:focus-within { border-color: var(--ink); box-shadow: 0 0 0 4px rgba(11,19,32,0.05), var(--shadow-card); }
.chat-input-prefix { color: var(--text-3); display: flex; align-items: center; }
.chat-input-box input {
  flex: 1;
  font-size: 14px;
  color: var(--text);
  padding: 8px 0;
  letter-spacing: -0.005em;
}
.chat-input-actions { display: flex; align-items: center; gap: 4px; }
.input-action-btn {
  width: 34px; height: 34px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2);
  transition: background 0.15s, color 0.15s;
}
.input-action-btn:hover { background: var(--ink-soft); color: var(--text); }
.send-btn {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--abbvie-blue);
  color: var(--teal);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, transform 0.1s, opacity 0.15s;
  flex-shrink: 0;
}
.send-btn:hover:not(:disabled) { background: var(--abbvie-blue-2); }
.send-btn:active:not(:disabled) { transform: scale(0.95); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; background: var(--paper-2); color: var(--text-3); }

.chat-input-foot {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 10px;
  font-family: var(--mono); font-size: 10.5px;
  color: var(--text-3);
  padding: 0 4px;
  letter-spacing: 0.04em;
}
.chat-input-foot .left { display: flex; align-items: center; gap: 14px; }
.chat-input-foot .left span { display: flex; align-items: center; gap: 5px; }
.chat-input-foot .kbd {
  font-family: var(--mono); font-size: 10px;
  color: var(--text-2);
  padding: 1px 5px; border-radius: 3px;
  border: 1px solid var(--rule);
  background: var(--paper-3);
  letter-spacing: 0;
}

/* ============================================================
   ADMIN
   ============================================================ */
.admin-screen { display: grid; grid-template-columns: 232px 1fr; flex: 1; overflow: hidden; background: var(--paper); }
.admin-sidebar {
  background: var(--paper-tinted);
  border-right: 1px solid var(--rule);
  padding: 18px 14px;
  display: flex; flex-direction: column;
  overflow-y: auto;
}
.admin-context {
  padding: 10px 12px 14px;
  margin-bottom: 6px;
  border-bottom: 1px solid var(--rule);
}
.admin-context .label {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 4px;
}
.admin-context .org {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px; font-weight: 500; letter-spacing: -0.005em;
}
.admin-context .badge {
  font-family: var(--mono); font-size: 9.5px;
  background: var(--ink); color: var(--teal);
  padding: 2px 8px; border-radius: 999px;
  letter-spacing: 0.10em;
}

.admin-sec {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-3);
  padding: 14px 10px 6px;
}
.admin-item {
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-2);
  cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  transition: background 0.12s, color 0.12s;
  letter-spacing: -0.005em;
  position: relative;
}
.admin-item:hover { background: var(--ink-soft); color: var(--text); }
.admin-item.active {
  background: var(--abbvie-blue); color: var(--text-on-ink);
}
.admin-item.active .ai-ic { color: var(--teal); }
.admin-item .ai-ic { width: 16px; height: 16px; flex-shrink: 0; }
.admin-item .ai-cnt {
  margin-left: auto;
  font-family: var(--mono); font-size: 10px;
  color: var(--text-3);
  padding: 1px 6px; border-radius: 999px;
  background: var(--paper-3);
  border: 1px solid var(--rule);
}
.admin-item.active .ai-cnt { background: rgba(244,241,234,0.10); border-color: rgba(244,241,234,0.16); color: var(--text-on-ink); }

.admin-footer { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--rule); }

/* admin main */
.admin-main {
  padding: 24px 32px 40px;
  overflow-y: auto;
  display: flex; flex-direction: column;
  gap: 22px;
  background: var(--paper);
}
.admin-header {
  display: flex; align-items: flex-end; justify-content: space-between;
  padding-bottom: 6px;
}
.admin-header-l { display: flex; flex-direction: column; gap: 6px; }
.admin-header h2 {
  font-size: 30px; font-weight: 500;
  letter-spacing: -0.025em;
  line-height: 1.1;
}
.admin-header h2 em { font-family: var(--serif); font-style: italic; font-weight: 400; }
.admin-header-meta {
  font-family: var(--mono); font-size: 11px;
  color: var(--text-3);
  letter-spacing: 0.04em;
}
.admin-header-r { display: flex; align-items: center; gap: 10px; }
.range-pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--paper-3);
  border: 1px solid var(--rule-2);
  padding: 7px 12px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: border-color 0.15s;
}
.range-pill:hover { border-color: var(--rule-strong); }
.range-pill-mono { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
.export-btn {
  padding: 7px 14px;
  border-radius: 999px;
  background: var(--abbvie-blue); color: var(--paper);
  font-size: 12.5px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 7px;
}
.export-btn:hover { background: var(--abbvie-blue-2); }

/* metrics */
.metrics-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
}
.metric {
  background: var(--paper-3);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  padding: 18px 18px 16px;
  position: relative;
  overflow: hidden;
}
.metric-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.metric-lbl {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-3);
  white-space: nowrap;
}
.metric-ic {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3);
}
.metric-val {
  font-family: var(--sans);
  font-size: 36px; font-weight: 500;
  letter-spacing: -0.03em;
  color: var(--text);
  line-height: 1;
  display: flex; align-items: baseline; gap: 6px;
}
.metric-val .pct { font-size: 18px; color: var(--text-2); font-weight: 400; }
.metric-val.green { color: var(--positive); }
.metric-val.amber { color: var(--warn); }
.metric-foot {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 12px;
  font-family: var(--mono); font-size: 11px;
  color: var(--text-3);
  letter-spacing: 0.02em;
}
.metric-trend {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-family: var(--mono); font-size: 10.5px;
  font-weight: 500;
}
.metric-trend.up { color: var(--positive); background: rgba(46,140,91,0.08); }
.metric-trend.down { color: var(--warn); background: var(--warn-soft); }
.metric-spark {
  position: absolute; right: 14px; bottom: 14px; opacity: 0.5;
  pointer-events: none;
}

.two-col { display: grid; grid-template-columns: 1.1fr 1fr; gap: 14px; }

.panel {
  background: var(--paper-3);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  padding: 0;
  overflow: hidden;
}
.panel-head {
  padding: 16px 20px 14px;
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: space-between;
}
.panel-title {
  font-size: 14px; font-weight: 500;
  letter-spacing: -0.005em;
  display: flex; align-items: center; gap: 9px;
}
.panel-title em { font-family: var(--serif); font-style: italic; font-weight: 400; }
.panel-title-ic { width: 16px; height: 16px; color: var(--text-3); }
.panel-tag {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--text-3);
  letter-spacing: 0.04em;
}
.panel-body { padding: 8px 12px 12px; }

.q-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 10px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.12s;
}
.q-row:hover { background: var(--paper-tinted); }
.q-rank {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--text-3);
  width: 18px;
  letter-spacing: 0.04em;
}
.q-text { color: var(--text); flex: 1; letter-spacing: -0.005em; }
.q-bar {
  width: 60px; height: 4px; border-radius: 2px;
  background: var(--paper-2); overflow: hidden;
  flex-shrink: 0;
}
.q-bar-fill { height: 100%; background: var(--teal); border-radius: 2px; }
.q-count {
  font-family: var(--mono); font-size: 11.5px; font-weight: 500;
  color: var(--text);
  width: 38px; text-align: right;
}

.gap-row {
  padding: 10px 12px;
  background: var(--paper-tinted);
  border: 1px solid var(--rule);
  border-radius: 8px;
  margin-bottom: 6px;
  font-size: 13px;
  display: flex; align-items: center; gap: 11px;
  cursor: pointer;
  transition: border-color 0.12s;
}
.gap-row:last-child { margin-bottom: 0; }
.gap-row:hover { border-color: var(--warn); }
.gap-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--warn);
  flex-shrink: 0;
  box-shadow: 0 0 8px rgba(181,104,28,0.4);
}
.gap-text { flex: 1; color: var(--text); letter-spacing: -0.005em; }
.gap-count {
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  color: var(--warn);
  padding: 2px 8px;
  background: var(--warn-soft);
  border-radius: 999px;
}
.gap-action {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--text-3);
  letter-spacing: 0.04em;
}

.bar-row {
  display: grid;
  grid-template-columns: 160px 1fr 48px;
  align-items: center;
  gap: 14px;
  padding: 10px 8px;
  font-size: 13px;
  border-bottom: 1px dashed var(--rule);
}
.bar-row:last-child { border-bottom: none; }
.bar-lbl { color: var(--text); letter-spacing: -0.005em; display: flex; align-items: center; gap: 8px; }
.bar-lbl .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.bar-lbl .dot.warn { background: var(--warn); }
.bar-track {
  height: 8px; background: var(--paper-2); border-radius: 4px; overflow: hidden;
  position: relative;
}
.bar-track::after {
  content: ''; position: absolute;
  left: 90%; top: -2px; bottom: -2px;
  width: 1px; background: var(--rule-strong);
}
.bar-fill {
  height: 100%; border-radius: 4px;
  background: linear-gradient(90deg, var(--teal-deep) 0%, var(--teal) 100%);
  transition: width 0.8s cubic-bezier(.2,.7,.2,1);
}
.bar-fill.warn { background: linear-gradient(90deg, var(--warn) 0%, #DA8A36 100%); }
.bar-pct {
  font-family: var(--mono); font-size: 12px; font-weight: 500;
  color: var(--text);
  text-align: right;
}
.bar-pct.warn { color: var(--warn); }

/* KB */
.kb-grid { display: grid; grid-template-columns: 280px 1fr; gap: 16px; padding: 16px 20px 20px; }
.upload-zone {
  border: 1.5px dashed var(--rule-2);
  border-radius: var(--r-lg);
  padding: 24px 20px;
  display: flex; flex-direction: column;
  align-items: center; gap: 8px;
  font-size: 13px;
  color: var(--text-2);
  text-align: center;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  background: var(--paper-tinted);
}
.upload-zone:hover { background: var(--paper-2); border-color: var(--ink); }
.upload-zone .up-ic {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--ink); color: var(--teal);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 4px;
}
.upload-zone .up-h { font-size: 14px; font-weight: 500; color: var(--text); letter-spacing: -0.005em; }
.upload-zone .up-p { font-size: 12px; color: var(--text-2); line-height: 1.45; }
.file-pills { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.file-pill {
  font-family: var(--mono); font-size: 9.5px;
  padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--rule);
  color: var(--text-2);
  background: var(--paper-3);
  letter-spacing: 0.06em;
}

.doc-list { display: flex; flex-direction: column; }
.doc-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 4px;
  border-bottom: 1px dashed var(--rule);
  font-size: 13px;
}
.doc-row:last-child { border-bottom: none; }
.doc-row-ic {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--paper-tinted);
  border: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2);
  flex-shrink: 0;
}
.doc-row-main { flex: 1; min-width: 0; }
.doc-name { color: var(--text); font-weight: 500; letter-spacing: -0.005em; }
.doc-meta { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); margin-top: 2px; letter-spacing: 0.02em; }
.doc-status {
  font-family: var(--mono); font-size: 10px;
  padding: 3px 9px; border-radius: 999px;
  background: var(--teal-soft);
  color: var(--teal-deep);
  border: 1px solid var(--teal-soft-2);
  letter-spacing: 0.06em;
}
.doc-status.warn { background: var(--warn-soft); color: var(--warn); border-color: rgba(181,104,28,0.18); }
.doc-action-btn {
  width: 28px; height: 28px;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3);
  transition: background 0.15s;
}
.doc-action-btn:hover { background: var(--ink-soft); color: var(--text); }

/* AI ask bar */
.ai-query-bar {
  display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--rule-2);
  border-radius: 16px;
  padding: 12px 12px 12px 18px;
  background: var(--ink);
  color: var(--text-on-ink);
  box-shadow: var(--shadow-card);
  position: relative;
  overflow: hidden;
}
.ai-query-bar::before {
  content: ''; position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at right, rgba(21,183,154,0.10) 0%, transparent 60%);
  pointer-events: none;
}
.ai-query-bar-ic {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
  color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  z-index: 1;
}
.ai-query-bar-text { flex: 1; font-size: 13.5px; color: var(--text-on-ink-2); z-index: 1; }
.ai-query-bar-text em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--text-on-ink); }
.ai-ask-btn {
  padding: 9px 18px;
  border-radius: 999px;
  background: var(--teal);
  color: var(--ink);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: -0.005em;
  display: inline-flex; align-items: center; gap: 7px;
  z-index: 1;
}
.ai-ask-btn:hover { background: #1DCBA9; }

/* ============================================================
   ADMIN TAB PAGES — extras
   ============================================================ */

/* User activity table */
.user-table { padding: 4px 8px 12px; }
.user-table-head, .user-table-row {
  display: grid;
  grid-template-columns: 2fr 1.3fr 0.7fr 1fr 1fr;
  align-items: center;
  gap: 14px;
  padding: 10px 12px;
}
.user-table-head {
  font-family: var(--sans);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-3);
  border-bottom: 1px solid var(--rule);
  padding-bottom: 8px;
}
.user-table-row {
  font-size: 13px;
  color: var(--text);
  border-bottom: 1px dashed var(--rule);
  letter-spacing: -0.005em;
}
.user-table-row:last-child { border-bottom: none; }
.user-table-row:hover { background: var(--paper-tinted); }
.user-cell { display: flex; align-items: center; gap: 10px; }
.user-av-tbl {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--ink); color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 500;
  flex-shrink: 0; position: relative;
}
.user-av-tbl::after {
  content: ''; position: absolute; bottom: 0; right: 0;
  width: 8px; height: 8px; border-radius: 50%;
  border: 2px solid var(--paper-3);
}
.user-av-tbl.active::after { background: var(--teal); }
.user-av-tbl.idle::after { background: var(--gold); }
.user-av-tbl.offline::after { background: var(--text-3); }
.user-cell-name { font-weight: 500; }
.user-cell-role { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.user-team { color: var(--text-2); font-size: 12.5px; }
.user-num { font-weight: 500; font-variant-numeric: tabular-nums; }
.user-conf { font-weight: 500; color: var(--positive); font-variant-numeric: tabular-nums; }
.user-conf.warn { color: var(--warn); }
.user-last { color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; }

/* Upload rows */
.upload-row {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 6px;
  border-bottom: 1px dashed var(--rule);
}
.upload-row:last-child { border-bottom: none; }
.upload-row-ic {
  width: 36px; height: 36px; border-radius: 8px;
  background: var(--paper-tinted);
  border: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2); flex-shrink: 0;
}
.upload-row-ic svg { width: 16px; height: 16px; }
.upload-row-main { flex: 1; min-width: 0; }
.upload-row-name { font-size: 13px; font-weight: 500; letter-spacing: -0.005em; }
.upload-row-meta { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.upload-progress {
  margin-top: 8px;
  height: 4px;
  background: var(--paper-2);
  border-radius: 4px;
  overflow: hidden;
}
.upload-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--teal-deep) 0%, var(--teal) 100%);
  border-radius: 4px;
  transition: width 0.4s ease;
}
.upload-pct {
  font-size: 12px; font-weight: 500;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  width: 42px; text-align: right;
}

/* Tips */
.tip-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 10px;
  border-radius: 8px;
}
.tip-row:hover { background: var(--paper-tinted); }
.tip-ic {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--teal-soft);
  color: var(--teal-deep);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.tip-ic svg { width: 12px; height: 12px; }
.tip-t { font-size: 13px; font-weight: 500; letter-spacing: -0.005em; }
.tip-d { font-size: 12px; color: var(--text-2); margin-top: 2px; line-height: 1.5; }

/* Docs tab */
.docs-toolbar {
  display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap;
}
.docs-search {
  flex: 1; min-width: 240px;
  display: flex; align-items: center; gap: 10px;
  height: 40px;
  padding: 0 14px;
  border: 1px solid var(--rule-2);
  border-radius: 10px;
  background: var(--paper-3);
}
.docs-search-ic { width: 14px; height: 14px; color: var(--text-3); }
.docs-search input { flex: 1; font-size: 13.5px; letter-spacing: -0.005em; }
.docs-filters { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.docs-chip {
  font-size: 12px; font-weight: 500;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--rule-2);
  background: var(--paper-3);
  color: var(--text-2);
  cursor: pointer;
  letter-spacing: -0.005em;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.docs-chip:hover { border-color: var(--rule-strong); color: var(--text); }
.docs-chip.on { background: var(--abbvie-blue); color: var(--paper); border-color: var(--abbvie-blue); }

.docs-table { padding: 4px 12px 12px; }
.docs-table-head, .docs-table-row {
  display: grid;
  grid-template-columns: 2.4fr 1fr 0.8fr 40px;
  align-items: center;
  gap: 14px;
  padding: 10px 12px;
}
.docs-table-head {
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-3);
  border-bottom: 1px solid var(--rule);
}
.docs-table-row {
  font-size: 13px;
  border-bottom: 1px dashed var(--rule);
}
.docs-table-row:last-child { border-bottom: none; }
.docs-table-row:hover { background: var(--paper-tinted); }

/* Analytics chart */
.chart-area {
  display: flex; align-items: flex-end;
  gap: 8px;
  height: 220px;
  padding: 8px 4px;
  border-bottom: 1px solid var(--rule);
}
.chart-bar {
  flex: 1;
  background: linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
  border-radius: 4px 4px 0 0;
  min-height: 4px;
  position: relative;
  transition: background 0.15s;
  cursor: default;
}
.chart-bar:hover { background: linear-gradient(180deg, var(--teal-deep) 0%, var(--ink) 100%); }
.chart-bar:hover .chart-bar-val { opacity: 1; }
.chart-bar-val {
  position: absolute;
  top: -22px; left: 50%;
  transform: translateX(-50%);
  font-size: 11px; font-weight: 500;
  color: var(--text);
  background: var(--paper-3);
  border: 1px solid var(--rule);
  padding: 2px 6px;
  border-radius: 4px;
  opacity: 0;
  transition: opacity 0.15s;
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.chart-axis {
  display: flex; gap: 8px;
  padding: 8px 4px 0;
  font-size: 11px;
  color: var(--text-3);
}
.chart-axis > span {
  flex: 1; text-align: center;
  letter-spacing: 0.04em;
}

/* Escalation queue */
.esc-row {
  display: grid;
  grid-template-columns: 90px 1fr 80px 100px;
  align-items: center;
  gap: 14px;
  padding: 14px 12px;
  border-bottom: 1px dashed var(--rule);
}
.esc-row:last-child { border-bottom: none; }
.esc-row:hover { background: var(--paper-tinted); }
.esc-state {
  font-size: 10px;
  letter-spacing: 0.12em;
  padding: 4px 10px;
  border-radius: 999px;
  font-weight: 500;
  text-align: center;
  justify-self: start;
}
.esc-state.open { background: var(--warn-soft); color: var(--warn); border: 1px solid rgba(181,104,28,0.22); }
.esc-state.assigned { background: var(--signal-soft); color: var(--signal); border: 1px solid rgba(45,91,255,0.22); }
.esc-state.resolved { background: rgba(46,140,91,0.10); color: var(--positive); border: 1px solid rgba(46,140,91,0.20); }
.esc-main { min-width: 0; }
.esc-q { font-size: 13.5px; font-weight: 500; letter-spacing: -0.005em; line-height: 1.45; }
.esc-meta { font-size: 12px; color: var(--text-3); margin-top: 4px; }
.esc-meta strong { color: var(--text-2); font-weight: 500; }
.esc-conf { text-align: center; }
.esc-conf-lbl { font-size: 9.5px; letter-spacing: 0.14em; color: var(--text-3); }
.esc-conf-v { font-size: 16px; font-weight: 500; color: var(--positive); margin-top: 2px; font-variant-numeric: tabular-nums; }
.esc-conf-v.warn { color: var(--warn); }
.esc-open {
  padding: 7px 12px;
  border-radius: 999px;
  background: var(--abbvie-blue); color: var(--paper);
  font-size: 12px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
  justify-self: end;
}
.esc-open:hover { background: var(--abbvie-blue-2); }

/* Feedback rows */
.fb-row {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 14px 12px;
  border-bottom: 1px dashed var(--rule);
}
.fb-row:last-child { border-bottom: none; }
.fb-row:hover { background: var(--paper-tinted); }
.fb-thumb {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.fb-thumb.up { background: var(--teal-soft); color: var(--teal-deep); }
.fb-thumb.down { background: var(--error-soft); color: var(--error); }
.fb-main { flex: 1; min-width: 0; }
.fb-q { font-size: 13.5px; font-weight: 500; letter-spacing: -0.005em; line-height: 1.45; }
.fb-note {
  font-size: 13px; color: var(--text-2);
  margin-top: 6px;
  padding-left: 10px;
  border-left: 2px solid var(--rule-2);
  line-height: 1.5;
  font-style: italic;
}
.fb-meta { font-size: 11.5px; color: var(--text-3); margin-top: 6px; }

/* ============================================================
   PURPLE SYSTEM
   #7050A0 \u2014 (A) admin/console identity \u00b7 (C) analytics 3rd series
   ============================================================ */

/* (A) Admin console identity \u2014 scoped to the admin shell only */
.app-shell.is-admin .nav-build { color: var(--purple-on-ink); }
.app-shell.is-admin .nav-links .nav-link.active { color: var(--purple-deep); }
.admin-context .badge { color: var(--purple); }
.admin-item.active { box-shadow: inset 3px 0 0 var(--purple); }
.admin-item.active .ai-ic { color: var(--purple); }
.admin-header h2 em { color: var(--purple-deep); }
/* the admin "Ask your data" AI bar reads as purple intelligence */
.ai-query-bar-ic { background: linear-gradient(135deg, var(--purple) 0%, var(--purple-deep) 100%); }
.ai-ask-btn { background: var(--purple); color: #fff; }
.ai-ask-btn:hover { background: var(--purple-deep); }

/* (C) Analytics \u2014 categorical series colors (teal primary \u00b7 purple \u00b7 gold) */
.bar-fill.teal   { background: linear-gradient(90deg, var(--teal-deep) 0%, var(--teal) 100%); }
.bar-fill.purple { background: linear-gradient(90deg, var(--purple-deep) 0%, var(--purple) 100%); }
.bar-fill.gold   { background: linear-gradient(90deg, #B68F3E 0%, var(--gold) 100%); }
.bar-fill.muted  { background: var(--rule-strong); }
.bar-lbl .dot.teal   { background: var(--teal); }
.bar-lbl .dot.purple { background: var(--purple); }
.bar-lbl .dot.gold   { background: var(--gold); }
.bar-lbl .dot.muted  { background: var(--text-3); }

/* Account dropdown (Sign out) */
.nav-account { position: relative; }
.nav-user-caret { font-size: 10px; color: var(--text-on-ink-3); margin-left: 1px; }
.nav-menu-backdrop { position: fixed; inset: 0; z-index: 40; }
.nav-menu {
  position: absolute; top: calc(100% + 8px); right: 0; z-index: 41;
  width: 244px; padding: 6px;
  background: var(--paper-3);
  border: 1px solid var(--rule);
  border-radius: var(--r);
  box-shadow: var(--shadow-lift);
  animation: menuIn 0.14s cubic-bezier(.2,.7,.2,1);
}
@keyframes menuIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.nav-menu-head { display: flex; align-items: center; gap: 10px; padding: 8px 10px 10px; border-bottom: 1px solid var(--rule); margin-bottom: 4px; }
.nav-menu-av {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--purple) 0%, var(--purple-deep) 100%);
  color: #fff; font-size: 12px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; letter-spacing: 0.02em;
}
.nav-menu-name { font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }
.nav-menu-mail { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); margin-top: 2px; }
.nav-menu-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 7px;
  font-size: 13px; color: var(--text-2); cursor: pointer;
  transition: background 0.13s, color 0.13s;
}
.nav-menu-item .nm-ic { width: 15px; height: 15px; flex-shrink: 0; color: var(--text-3); }
.nav-menu-item:hover { background: var(--ink-soft); color: var(--text); }
.nav-menu-sep { height: 1px; background: var(--rule); margin: 4px 6px; }
.nav-menu-item.danger { color: var(--error); }
.nav-menu-item.danger .nm-ic { color: var(--error); }
.nav-menu-item.danger:hover { background: var(--error-soft); color: var(--error); }

/* ============================================================
   LOGOUT EXPERIENCE \u00b7 confirm dialog + signed-out banner
   ============================================================ */
.logout-overlay {
  position: fixed; inset: 0; z-index: 60;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  background: rgba(3,15,64,0.46);
  backdrop-filter: blur(3px);
  animation: fadeIn 0.18s ease both;
}
.logout-dialog {
  width: 412px; max-width: 100%;
  background: var(--paper-3);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lift);
  padding: 30px 30px 24px;
  animation: dialogIn 0.2s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes dialogIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }
.logout-dialog .ld-ic {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--abbvie-blue); color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 18px;
}
.logout-dialog .ld-ic svg { width: 22px; height: 22px; }
.logout-dialog h3 {
  font-family: var(--sans); font-size: 20px; font-weight: 600;
  letter-spacing: -0.02em; color: var(--text); margin-bottom: 8px;
}
.logout-dialog p {
  font-size: 14px; line-height: 1.5; color: var(--text-2); margin-bottom: 24px;
}
.logout-actions { display: flex; gap: 10px; justify-content: flex-end; }
.logout-btn {
  font-family: var(--sans); font-size: 13.5px; font-weight: 600;
  padding: 10px 18px; border-radius: 999px; cursor: pointer;
  transition: background 0.14s, color 0.14s, border-color 0.14s;
}
.logout-btn.ghost {
  background: transparent; color: var(--text-2);
  border: 1px solid var(--rule-strong);
}
.logout-btn.ghost:hover { background: var(--ink-soft); color: var(--text); }
.logout-btn.solid {
  background: var(--abbvie-blue); color: var(--paper); border: 1px solid var(--abbvie-blue);
  display: inline-flex; align-items: center; gap: 8px;
}
.logout-btn.solid:hover { background: #071654; }
.logout-btn.solid svg { width: 14px; height: 14px; }

/* signed-out confirmation banner on the login card */
.signed-out-banner {

// ---- Answer text parsing ----
function cleanSourceName(raw) {
  if (!raw) return null;
  return raw
    .replace(/\.(pdf|docx|doc|txt|csv|pptx|xlsx)$/i, '')
    .replace(/[_-]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function parseAnswer(text) {
  if (!text) return { paragraphs: [], takeaway: null, sourceInText: null };

  // Extract inline Source: line that Claude writes at the end
  const sourceRx = /(?:^|\n)Source:\s*(.+?)(?:\n|$)/i;
  const sourceMatch = text.match(sourceRx);
  const sourceInText = sourceMatch ? sourceMatch[1].trim() : null;
  let body = sourceMatch ? text.replace(sourceMatch[0], '').trim() : text;

  // Split "The bottom line:" off — it always appears as its own sentence
  const bottomRx = /(?:^|\n)(The bottom line:\s*.+?)(?:\n|$)/i;
  const bottomMatch = body.match(bottomRx);
  let takeaway = null;
  if (bottomMatch) {
    takeaway = bottomMatch[1].replace(/^the bottom line:\s*/i, '').trim();
    body = body.replace(bottomMatch[0], '').trim();
  }

  // Split remaining text into paragraphs (single or double newlines)
  const rawParagraphs = body.split(/\n+/).map(p => p.trim()).filter(Boolean);

  // Tag paragraphs: detect example/illustration markers
  const exampleRx = /^(Think of it this way:|Here['']?s a practical example:|Building on what we covered)/i;
  const paragraphs = rawParagraphs.map(p => ({
    text: p,
    isExample: exampleRx.test(p),
  }));

  return { paragraphs, takeaway, sourceInText };
}

function AnswerBody({ text }) {
  const { paragraphs, takeaway, sourceInText } = parseAnswer(text);

  // Fallback: render plain if nothing was parsed
  if (!paragraphs.length && !takeaway) {
    return <div className="ai-card-body">{text}</div>;
  }

  return (
    <div className="ai-card-body parsed">
      {paragraphs.map((p, i) =>
        p.isExample
          ? <div key={i} className="answer-example">{p.text}</div>
          : <p key={i} className="answer-p">{p.text}</p>
      )}
      {takeaway && (
        <div className="answer-takeaway">
          <span className="answer-takeaway-label">The bottom line</span>
          <span className="answer-takeaway-text">{takeaway}</span>
        </div>
      )}
    </div>
  );
}

function ConfidenceArc({ value }) {
  const color = value >= 75 ? 'var(--teal)' : 'var(--warn)';
  const bg = `conic-gradient(${color} ${value * 3.6}deg, var(--paper-2) 0deg)`;
  return (
    <div className="conf-arc" style={{ background: bg }}>
      <div className="conf-arc-inner">{value}</div>
    </div>
  );
}

function MiniSpark({ data, color = 'var(--ink)' }) {
  const w = 64, h = 22;
  const max = Math.max(...data), min = Math.min(...data);
  const range = max - min || 1;
  const pts = data.map((d, i) => {
    const x = i / (data.length - 1) * w;
    const y = h - (d - min) / range * h;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg width={w} height={h} className="metric-spark" style={{ position: 'absolute', right: 18, bottom: 14 }}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" opacity="0.55" />
      <circle cx={w} cy={h - (data[data.length - 1] - min) / range * h} r="2" fill={color} />
    </svg>
  );
}

/* ============================================================
   CHAT SCREEN
   ============================================================ */
function ChatScreen({ user, onAdmin, onLogout, onRewatch }) {
  const initials = user ? (user.initials || (user.name || '').split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase() || 'U') : 'U';
  const firstName = user ? (user.name || '').split(' ')[0] || 'there' : 'there';

  const [messages, setMessages] = useState([{
    id: 1, role: 'ai',
    text: `Hello ${firstName}, I'm SISO Live!, your precision learning tool for supplier inclusion and sustainability. What would you like to explore today?`,
    conf: null, source: null, nudge: null, feedback: null, showComment: false, comment: ''
  }]);
  const [input, setInput] = useState('');
  const [typing, setTyping] = useState(false);
  const endRef = useRef();

  useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, typing]);

  const chips = [
    'What is supplier inclusion and how is it different from supplier diversity?',
    'What are AbbVie\'s four pillars of supplier inclusion?',
    'How does AbbVie measure and track supplier inclusion progress?',
    'What role does environmental stewardship play in AbbVie\'s supplier strategy?',
  ];

  const sendMessage = async (text) => {
    const q = text || input.trim();
    if (!q) return;
    setInput('');
    const newMsg = { id: Date.now(), role: 'user', text: q };
    setMessages((m) => [...m, newMsg]);
    setTyping(true);
    try {
      const history = messages
        .filter(m => m.role === 'user' || (m.role === 'ai' && m.text))
        .map(m => ({ role: m.role === 'ai' ? 'assistant' : 'user', content: m.text || '' }))
        .filter(m => m.content);
      const result = await ChatAPI.query(q, history);
      setTyping(false);
      const answer = result.answer || result.text || null;
      const conf = result.confidencePercent != null
        ? result.confidencePercent
        : result.confidence != null
          ? Math.round(result.confidence * 100)
          : (answer ? 95 : 60);
      const escalated = result.shouldEscalate === true;
      // Extract source: try parsed text first, then top API source
      const { sourceInText } = parseAnswer((!escalated && conf >= 45) ? answer : null);
      const apiSource = result.sources?.[0]?.filename || null;
      setMessages((m) => [...m, {
        id: Date.now() + 1, role: 'ai',
        text: (!escalated && conf >= 45) ? answer : null,
        conf, escalated,
        source: sourceInText || apiSource || null,
        nudge: result.nudge || null,
        feedback: null, showComment: false, comment: '',
      }]);
    } catch (e) {
      setTyping(false);
      // Show actual server error so issues are diagnosable; fall back to generic for network failures
      const msg = (e.message && e.message !== 'Query failed' && e.message !== 'Failed to fetch')
        ? e.message
        : "I'm having trouble connecting right now. Please try again in a moment.";
      setMessages((m) => [...m, {
        id: Date.now() + 1, role: 'ai',
        text: msg,
        conf: null, source: null, nudge: null,
        feedback: null, showComment: false, comment: '', chars: null
      }]);
    }
  };

  const setFeedback = (id, val) => {
    setMessages((m) => m.map((msg) =>
      msg.id === id ? { ...msg, feedback: val, showComment: val === 'down' } : msg
    ));
    // For thumbs-up, log immediately (no comment needed).
    // For thumbs-down, wait for submitComment so the comment is included.
    if (val !== 'down') {
      const msg = messages.find(m => m.id === id);
      if (msg) ChatAPI.feedback(id, val, '').catch(() => {});
    }
  };

  const submitComment = (id) => {
    const msg = messages.find(m => m.id === id);
    if (msg) ChatAPI.feedback(id, 'down', msg.comment).catch(() => {});
    setMessages((m) => m.map((msg) =>
      msg.id === id ? { ...msg, showComment: false } : msg
    ));
  };

  const updateComment = (id, val) => {
    setMessages((m) => m.map((msg) => msg.id === id ? { ...msg, comment: val } : msg));
  };

  const nowStr = () => {
    const d = new Date();
    return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase();
  };

  return (
    <div className="app-shell">
      <div className="nav-top">
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <div className="nav-top-logo">
            <div className="nav-org"><img src="assets/abbvie-logo-white.png" alt="AbbVie" /></div>
            <div className="nav-sep"></div>
            <span className="nav-wordmark">SISO<span className="live">Live!</span></span>
          </div>
          <span className="nav-build"></span>
        </div>
        <div className="nav-links">
          <div className="nav-link active">Learning tool</div>
          {onAdmin && <div className="nav-link" onClick={onAdmin}>Admin dashboard</div>}
        </div>
        <div className="nav-right">
          <div className="nav-status">
            <div className="nav-status-dot" />
            All systems normal
          </div>
          <NavAccount user={user} onLogout={onLogout} onRewatch={onRewatch} />
        </div>
      </div>

      <div className="chat-screen">
        <div className="sidebar">
          <div className="sidebar-top">
            <button className="new-conv-btn" onClick={() => {
              setMessages([{
                id: Date.now(), role: 'ai',
                text: `Hello ${firstName}, I'm SISO Live!, your precision learning tool for supplier inclusion and sustainability. What would you like to explore today?`,
                conf: null, source: null, nudge: null, feedback: null, showComment: false, comment: ''
              }]);
              setInput('');
            }}>
              <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <div style={{ width: 14, height: 14, color: 'var(--text-2)' }}><Icons.plus /></div>
                New conversation
              </span>
              <span className="kbd">⌘ K</span>
            </button>
          </div>

          <div className="sidebar-body">
            <div className="sidebar-sec">Start here <span className="cnt">{chips.length}</span></div>
            <div className="sidebar-chips">
              {chips.map((c, i) => (
                <div key={c} className="sidebar-chip" onClick={() => sendMessage(c)}>
                  <span className="chip-mark">0{i + 1}</span>
                  <span>{c}</span>
                </div>
              ))}
            </div>
          </div>

          <div className="sidebar-footer">
            <div className="user-av-side">{initials}</div>
            <div className="user-info-side">
              <div className="n">{user ? (user.name || user.email || 'User') : 'User'}</div>
              <div className="r">{user ? ((user.role || 'User').toUpperCase() + ' · ABBVIE') : 'ABBVIE'}</div>
            </div>
            <div className="chev" style={{ width: 14, height: 14 }}><Icons.chevron /></div>
          </div>
        </div>

        <div className="chat-area">
          <div className="chat-topbar">
            <div className="chat-topbar-left-row">
              <div className="chat-topbar-title">
                Supplier Inclusion &amp; <em>Sustainability</em>
              </div>
              <div className="chat-topbar-meta">SUPPLIER INCLUSION · SESSION</div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <div className="verified-badge">
                <div className="verified-dot" />
                Sourced from verified AbbVie docs
              </div>
              <div className="chat-actions" style={{ display: 'none' }}>
                <button className="chat-action-btn" title="Share"><div style={{ width: 15, height: 15 }}><Icons.share /></div></button>
                <button className="chat-action-btn" title="More"><div style={{ width: 15, height: 15 }}><Icons.more /></div></button>
              </div>
            </div>
          </div>

          <div className="messages">
            <div className="messages-inner">
              {messages.map((msg) => {
                if (msg.role === 'user') {
                  return (
                    <div key={msg.id} className="msg-user">
                      <div className="bubble-user">{msg.text}</div>
                      <div className="msg-user-meta">{initials} · just now</div>
                    </div>
                  );
                }
                return (
                  <div key={msg.id} className="msg-ai">
                    <div className="msg-ai-head">

                      <span className="msg-ai-name">SISO <em>Live!</em></span>
                      <span className="msg-ai-time">{nowStr()}</span>
                    </div>

                    {msg.conf === null && msg.text && (
                      <div className="ai-card">
                        <div className="ai-card-body" style={{ fontSize: 15, lineHeight: 1.7 }}>{msg.text}</div>
                      </div>
                    )}

                    {msg.conf !== null && !msg.escalated && msg.conf >= 45 && (() => {
                      const { sourceInText } = parseAnswer(msg.text);
                      const displaySource = cleanSourceName(sourceInText || msg.source);
                      return (
                        <div className="ai-card">
                          <AnswerBody text={msg.text} />
                          <div className="ai-card-foot">
                            <div className="conf-gauge">
                              <ConfidenceArc value={msg.conf} />
                              <div className="conf-text">Confidence <b>{msg.conf}%</b></div>
                            </div>
                            {displaySource && (
                              <div className="source-chip" title={displaySource}>
                                <span className="doc-mark"><Icons.files /></span>
                                {displaySource}
                              </div>
                            )}
                            <div className="msg-foot-meta">
                              <span className="foot-meta-pill">RAG retrieval</span>
                            </div>
                          </div>
                        </div>
                      );
                    })()}

                    {msg.conf !== null && (msg.escalated || msg.conf < 45) && (
                      <div className="ai-card">
                        <div className="ai-card-body low-conf">
                          I don't have enough verified information to answer this confidently. For accurate guidance, please reach out to the SISO support desk. They're the right resource for this.
                        </div>
                        <div className="ai-card-foot">
                          <div className="conf-gauge">
                            <ConfidenceArc value={msg.conf} />
                            <div className="conf-text warn">Confidence <b>{msg.conf}%</b> · below threshold</div>
                          </div>
                          <div className="msg-foot-meta">
                            <span className="foot-meta-pill">Escalated to SISO support</span>
                          </div>
                        </div>
                      </div>
                    )}

                    {msg.conf !== null && (
                      <div className="feedback-row">
                        <span className="fb-lbl">Was this helpful?</span>
                        <button
                          className={`fb-btn ${msg.feedback === 'up' ? 'up-on' : ''}`}
                          onClick={() => setFeedback(msg.id, 'up')}
                          aria-label="Thumbs up">
                          <div style={{ width: 14, height: 14 }}><Icons.thumbup /></div>
                        </button>
                        <button
                          className={`fb-btn ${msg.feedback === 'down' ? 'dn-on' : ''}`}
                          onClick={() => setFeedback(msg.id, 'down')}
                          aria-label="Thumbs down">
                          <div style={{ width: 14, height: 14 }}><Icons.thumbdown /></div>
                        </button>
                        {(msg.feedback === 'up' || (msg.feedback === 'down' && !msg.showComment)) && (
                          <span className="fb-thanks">
                            <div style={{ width: 11, height: 11 }}><Icons.check /></div>
                            Thanks, logged
                          </span>
                        )}
                      </div>
                    )}

                    {msg.showComment && (
                      <div className="fb-comment-box">
                        <textarea
                          placeholder="What was wrong with this answer? (optional, helps us improve)"
                          value={msg.comment}
                          onChange={(e) => updateComment(msg.id, e.target.value)} />
                        <button className="fb-submit" onClick={() => submitComment(msg.id)}>
                          Submit feedback
                          <div style={{ width: 11, height: 11 }}><Icons.arrow /></div>
                        </button>
                      </div>
                    )}

                    {!msg.escalated && msg.conf >= 45 && msg.nudge && (
                      <div className="nudge" onClick={() => sendMessage(msg.nudge)} role="button" tabIndex={0} onKeyDown={(e) => e.key === 'Enter' && sendMessage(msg.nudge)}>
                        <div className="nudge-ic"><div style={{ width: 16, height: 16 }}><Icons.sparkles /></div></div>
                        <span>{msg.nudge}</span>
                        <span className="arr">EXPLORE →</span>
                      </div>
                    )}

                    {msg.conf !== null && (msg.escalated || msg.conf < 45) && (
                      <div className="escalate-card">
                        <div className="escalate-ic"><div style={{ width: 16, height: 16 }}><Icons.headset /></div></div>
                        <div className="escalate-body">
                          <div className="escalate-title">This is best handled by the SISO <em>support team</em>.</div>
                          <div className="escalate-desc">They'll provide a precise, verified answer. Typical response under 24 hours.</div>
                        </div>
                        <a className="escalate-btn" href="mailto:siso-support@abbvie.com" style={{ textDecoration: 'none' }}>
                          Contact support
                          <div style={{ width: 10, height: 10 }}><Icons.arrow /></div>
                        </a>
                      </div>
                    )}
                  </div>
                );
              })}

              {typing && (
                <div className="msg-ai">
                  <div className="msg-ai-head">
                    <span className="msg-ai-name">SISO <em>Live!</em></span>
                    <span className="msg-ai-time">retrieving...</span>
                  </div>
                  <div className="ai-card">
                    <div className="typing-bubble">
                      <div className="typing-dot" /><div className="typing-dot" /><div className="typing-dot" />
                      <span className="typing-label">Searching verified sources</span>
                    </div>
                  </div>
                </div>
              )}
              <div ref={endRef} />
            </div>
          </div>

          <div className="chat-input-area">
            <div className="chat-input-wrap">
              <div className="chat-input-box">
                <div className="chat-input-prefix">
                  <div style={{ width: 16, height: 16 }}><Icons.search /></div>
                </div>
                <input
                  type="text"
                  placeholder="Ask about supplier inclusion or sustainability…"
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && !typing && sendMessage()} />
                <div className="chat-input-actions">
                  <button className="send-btn" onClick={() => sendMessage()} disabled={typing || !input.trim()}>
                    <div style={{ width: 14, height: 14 }}><Icons.send /></div>
                  </button>
                </div>
              </div>
              <div className="chat-input-foot">
                <div className="left">
                  <span><div style={{ width: 10, height: 10, display: 'inline-block' }}><Icons.lock /></div> AbbVie internal · encrypted</span>
                  <span>Retrieval over verified sources</span>
                </div>
                <span>Press <span className="kbd">↵</span> to send</span>
              </div>
            </div>
          </div>
        </div>

        <aside className="chat-rail">
          <div className="chat-rail-head">
            <div className="chat-rail-title">SISO<em>Live!</em> Assistant</div>
            <div className="chat-rail-tag">COMPANION</div>
          </div>
          <div className="chat-rail-body">
            <div className={"assistant-stage" + (typing ? " thinking" : "")}>
              <div className="stage-ph" id="stage-placeholder">

/* ============================================================
   ADMIN — UPLOAD
   ============================================================ */
function AdminUpload() {
  const [files, setFiles] = useState([]);
  const [dragOver, setDragOver] = useState(false);
  const fileInputRef = useRef();

  const handleFiles = async (fileList) => {
    const newFiles = Array.from(fileList).map(f => ({
      file: f, name: f.name, size: f.size, status: 'Uploading', pct: 0, id: Date.now() + Math.random()
    }));
    setFiles(prev => [...prev, ...newFiles]);

    for (const item of newFiles) {
      try {
        setFiles(prev => prev.map(f => f.id === item.id ? { ...f, pct: 30, status: 'Processing' } : f));
        await AdminAPI.uploadDocument(item.file);
        setFiles(prev => prev.map(f => f.id === item.id ? { ...f, pct: 100, status: 'Indexed', error: null } : f));
      } catch (e) {
        setFiles(prev => prev.map(f => f.id === item.id ? { ...f, pct: 0, status: 'Failed', error: e.message || 'Upload failed' } : f));
      }
    }
  };

  const fmtSize = (b) => b > 1048576 ? `${(b / 1048576).toFixed(1)} MB` : `${(b / 1024).toFixed(0)} KB`;

  return (
    <>
      <div className="panel" style={{ overflow: 'visible' }}>
        <div className="panel-head">
          <div className="panel-title"><span className="panel-title-ic"><Icons.upload /></span>Add to <em>knowledge base</em></div>
          <span className="panel-tag">CHUNKED &amp; EMBEDDED ON UPLOAD</span>
        </div>
        <div className="panel-body" style={{ padding: '16px 20px 20px', overflow: 'visible' }}>
          <input ref={fileInputRef} type="file" multiple accept=".pdf,.docx,.doc,.csv,.txt"
            style={{ display: 'none' }} onChange={(e) => handleFiles(e.target.files)} />
          <div
            className="upload-zone"
            style={{ padding: '44px 24px', borderColor: dragOver ? 'var(--ink)' : undefined, background: dragOver ? 'var(--paper-2)' : undefined }}
            onClick={() => fileInputRef.current?.click()}
            onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
            onDragLeave={() => setDragOver(false)}
            onDrop={(e) => { e.preventDefault(); setDragOver(false); handleFiles(e.dataTransfer.files); }}>
            <div className="up-ic"><div style={{ width: 22, height: 22 }}><Icons.upload /></div></div>
            <div className="up-h">Drop files to ingest</div>
            <div className="up-p">Files are automatically chunked and embedded into the RAG index. PDFs are OCR'd, videos transcribed.</div>
            <div className="file-pills">
              {['PDF', 'DOCX', 'CSV', 'TXT'].map((t) => (
                <span key={t} className="file-pill">{t}</span>
              ))}
            </div>
          </div>
        </div>
      </div>

      {files.length > 0 && (
        <div className="panel">
          <div className="panel-head">
            <div className="panel-title"><span className="panel-title-ic"><Icons.refresh /></span>Upload <em>queue</em></div>
            <span className="panel-tag">{files.length} FILES</span>
          </div>
          <div className="panel-body">
            {files.map((f) => (
              <div key={f.id} className="upload-row">
                <div className="upload-row-ic"><Icons.files /></div>
                <div className="upload-row-main">
                  <div className="upload-row-name">{f.name}</div>
                  <div className="upload-row-meta" style={{ color: f.status === 'Failed' ? 'var(--warn, #c0392b)' : undefined }}>
                    {f.status} · {fmtSize(f.size)}
                  </div>
                  {f.error && <div style={{ fontSize: 11, color: 'var(--warn, #c0392b)', marginTop: 2, lineHeight: 1.4 }}>{f.error}</div>}
                  <div className="upload-progress">
                    <div className="upload-progress-fill" style={{ width: `${f.pct}%` }} />
                  </div>
                </div>
                <span className="upload-pct">{f.pct}%</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="panel">
        <div className="panel-head"><div className="panel-title"><span className="panel-title-ic"><Icons.info /></span>Ingestion <em>tips</em></div><span className="panel-tag">BEST PRACTICES</span></div>
        <div className="panel-body" style={{ padding: '4px 8px 12px' }}>
          {[
            ['Use descriptive filenames', 'They become part of source attribution.'],
            ['Prefer text-native PDFs', 'OCR works on scans but adds latency.'],
            ['Add a one-page summary', 'Improves retrieval for broad questions.'],
            ['Mark drafts clearly', 'Use "Draft" in the filename to gate confidence.']
          ].map(([t, d]) => (
            <div key={t} className="tip-row">
              <div className="tip-ic"><Icons.check /></div>
              <div>
                <div className="tip-t">{t}</div>
                <div className="tip-d">{d}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </>
  );
}

function SystemHealthPanel() {
  const [health, setHealth] = useState(null);
  const [running, setRunning] = useState(false);

  const run = async () => {
    setRunning(true);
    try {
      const d = await AdminAPI.getDiagnostics();
      setHealth(d);
    } catch (e) {
      setHealth({ error: e.message });
    } finally {
      setRunning(false);
    }
  };

  const pineconeOk = health && health.pinecone?.status === 'connected';
  const cohereOk = health && health.cohere?.status === 'connected';
  const vectorCount = health?.pinecone?.vectorCount;
  const matches = health?.testQuery?.matches || [];

  return (
    <div className="panel" style={{ marginBottom: 20 }}>
      <div className="panel-head">
        <div className="panel-title"><span className="panel-title-ic"><Icons.shield /></span>System <em>health</em></div>
        <button className="export-btn" onClick={run} disabled={running} style={{ opacity: running ? 0.6 : 1 }}>
          {running ? 'Running…' : 'Run diagnostic'}
        </button>
      </div>
      {!health && !running && (
        <div style={{ padding: '20px 24px', fontSize: 13, color: 'var(--text-3)' }}>
          Click "Run diagnostic" to verify all AI services are working and documents are searchable.
        </div>
      )}
      {running && (
        <div style={{ padding: '20px 24px', fontSize: 13, color: 'var(--text-3)' }}>Checking services…</div>
      )}
      {health && !running && (
        <div style={{ padding: '16px 24px', display: 'flex', flexDirection: 'column', gap: 12 }}>
          {health.error && (
            <div style={{ fontSize: 13, color: 'var(--signal)', background: 'var(--signal-soft)', borderRadius: 8, padding: '10px 14px' }}>
              Diagnostic failed: {health.error}
            </div>
          )}
          <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
            <div style={{ flex: 1, minWidth: 160, background: 'var(--bg-2)', borderRadius: 10, padding: '12px 14px' }}>
              <div style={{ fontSize: 11, fontFamily: 'var(--mono)', color: 'var(--text-3)', marginBottom: 4 }}>AI SEARCH INDEX</div>
              <div style={{ fontSize: 13, fontWeight: 600, color: pineconeOk ? 'var(--teal)' : 'var(--signal)' }}>
                {health.pinecone?.status === 'connected' ? 'Connected' : health.pinecone?.status === 'not_initialized' ? 'Not connected' : 'Error'}
              </div>
              {vectorCount != null && (
                <div style={{ fontSize: 12, color: 'var(--text-2)', marginTop: 2 }}>
                  {vectorCount === 0
                    ? <span style={{ color: 'var(--signal)' }}>No documents are searchable yet</span>
                    : <span style={{ color: 'var(--teal)' }}>{vectorCount} document sections indexed</span>
                  }
                </div>
              )}
              {health.pinecone?.error && <div style={{ fontSize: 11, color: 'var(--signal)', marginTop: 2 }}>{health.pinecone.error}</div>}
            </div>
            <div style={{ flex: 1, minWidth: 160, background: 'var(--bg-2)', borderRadius: 10, padding: '12px 14px' }}>
              <div style={{ fontSize: 11, fontFamily: 'var(--mono)', color: 'var(--text-3)', marginBottom: 4 }}>AI LANGUAGE MODEL</div>
              <div style={{ fontSize: 13, fontWeight: 600, color: cohereOk ? 'var(--teal)' : 'var(--signal)' }}>
                {cohereOk ? 'Connected' : 'Error'}
              </div>
              {health.cohere?.error && <div style={{ fontSize: 11, color: 'var(--signal)', marginTop: 2 }}>{health.cohere.error}</div>}
            </div>
            {health.config && (
              <div style={{ flex: 1, minWidth: 160, background: 'var(--bg-2)', borderRadius: 10, padding: '12px 14px' }}>
                <div style={{ fontSize: 11, fontFamily: 'var(--mono)', color: 'var(--text-3)', marginBottom: 4 }}>SETTINGS</div>
                <div style={{ fontSize: 12, color: 'var(--text-2)', lineHeight: 1.7 }}>
                  <div>Confidence threshold: <strong style={{ color: parseFloat(health.config.confidenceThreshold) > 0.5 ? 'var(--signal)' : 'var(--text)' }}>{health.config.confidenceThreshold}</strong></div>
                  <div>Search index: <strong style={{ color: 'var(--text)' }}>{health.config.pineconeIndex}</strong></div>
                </div>
              </div>
            )}
          </div>
          {matches.length > 0 && (
            <div>
              <div style={{ fontSize: 11, fontFamily: 'var(--mono)', color: 'var(--text-3)', marginBottom: 8 }}>LIVE TEST: "What is supplier inclusion?" — DOCUMENT SECTIONS FOUND</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {matches.map((m, i) => (
                  <div key={i} style={{ background: 'var(--bg-2)', borderRadius: 8, padding: '10px 12px', fontSize: 12 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
                      <span style={{ fontWeight: 600, color: 'var(--text)' }}>{m.source || 'Unknown'}</span>
                      <span style={{ fontFamily: 'var(--mono)', color: m.score >= 0.40 ? 'var(--teal)' : 'var(--signal)' }}>
                        score: {m.score}
                      </span>
                    </div>
                    <div style={{ color: 'var(--text-2)', lineHeight: 1.5 }}>{m.preview}</div>
                  </div>
                ))}
              </div>

            <div style={{ fontSize: 13, color: 'var(--signal)', background: 'var(--signal-soft)', borderRadius: 8, padding: '10px 14px' }}>
              AI services are connected but no documents are searchable yet. Use "Re-index" on each document below to make them available to the AI.
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   ADMIN — DOCS
   ============================================================ */
function AdminDocs() {
  const [docs, setDocs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState('All topics');
  const [reindexing, setReindexing] = useState({});

  useEffect(() => {
    AdminAPI.getDocs()
      .then(d => { setDocs(Array.isArray(d) ? d : (d.documents || d.docs || [])); setLoading(false); })
      .catch(() => setLoading(false));
  }, []);

  const handleDelete = async (id) => {
    if (!confirm('Delete this document from the knowledge base?')) return;
    try {
      await AdminAPI.deleteDoc(id);
      setDocs(prev => prev.filter(d => d.id !== id));
    } catch (e) {
      alert('Failed to delete document: ' + e.message);
    }
  };

  const handleReingest = async (id) => {
    setReindexing(prev => ({ ...prev, [id]: true }));
    try {
      const result = await AdminAPI.reingestDoc(id);
      setDocs(prev => prev.map(d => d.id === id ? { ...d, has_vectors: true, status: 'active', chunk_count: result.chunkCount } : d));
    } catch (e) {
      alert('Re-index failed: ' + e.message);
    } finally {
      setReindexing(prev => ({ ...prev, [id]: false }));
    }
  };

  if (loading) {
    return <div style={{ padding: 40, color: 'var(--text-3)', fontFamily: 'var(--mono)', fontSize: 13, textAlign: 'center' }}>Loading documents…</div>;
  }

  const needsReindex = docs.some(d => d.has_vectors === false);

  return (
    <>
      <SystemHealthPanel />

      {needsReindex && (
        <div style={{ background: 'var(--signal-soft)', border: '1px solid var(--signal)', borderRadius: 10, padding: '12px 16px', marginBottom: 16, fontSize: 13, color: 'var(--signal)', display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ width: 16, height: 16, flexShrink: 0 }}><Icons.alert /></div>
          Some documents aren't searchable yet — the AI won't be able to find them. Click <strong>Re-index</strong> next to each affected document to activate it. This usually takes under 30 seconds.
        </div>
      )}

      <div className="docs-toolbar">
        <div className="docs-search">
          <div className="docs-search-ic"><Icons.search /></div>
          <input placeholder="Search documents, topics, sources…" />
        </div>
        <div className="docs-filters">
          {['All topics', 'Active', 'Reindex', 'Stale'].map((t) => (
            <span key={t} className={`docs-chip ${filter === t ? 'on' : ''}`} onClick={() => setFilter(t)}>{t}</span>
          ))}
        </div>
      </div>

      <div className="panel">
        <div className="panel-head">
          <div className="panel-title"><span className="panel-title-ic"><Icons.files /></span>All <em>documents</em></div>
          <span className="panel-tag">{docs.length} DOCUMENTS</span>
        </div>
        {docs.length === 0 ? (
          <div style={{ padding: '40px 20px', color: 'var(--text-3)', fontSize: 14, textAlign: 'center' }}>
            No documents in the knowledge base yet. Upload files above to get started.
          </div>
        ) : (
          <div className="docs-table">
            <div className="docs-table-head">
              <span>Document</span><span>Chunks</span><span>Status</span><span></span>
            </div>
            {docs.map((d) => {
              const missingVectors = d.has_vectors === false;
              return (
                <div key={d.id || d.name} className="docs-table-row">
                  <div className="doc-row-main" style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
                    <div className="doc-row-ic"><div style={{ width: 15, height: 15 }}><Icons.files /></div></div>
                    <div>
                      <div className="doc-name">{d.name || d.filename || d.title}</div>
                      <div className="doc-meta">{d.file_type?.toUpperCase() || ''} {d.file_size_bytes ? `· ${Math.round(d.file_size_bytes / 1024)}KB` : ''}</div>
                    </div>
                  </div>
                  <span style={{ fontSize: 12, color: 'var(--text-2)' }}>{d.chunk_count ? `${d.chunk_count} chunks` : '—'}</span>
                  <span className={`doc-status ${missingVectors ? 'warn' : ''}`}>
                    {missingVectors ? 'NOT SEARCHABLE' : (d.status || 'ACTIVE').toUpperCase()}
                  </span>
                  <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                    {missingVectors && (
                      <button
                        className="export-btn"
                        style={{ padding: '5px 10px', fontSize: 11, background: 'var(--signal)', color: '#fff' }}
                        onClick={() => handleReingest(d.id)}
                        disabled={reindexing[d.id]}
                      >
                        {reindexing[d.id] ? 'Indexing…' : 'Re-index'}
                      </button>
                    )}
                    <button className="doc-action-btn" onClick={() => handleDelete(d.id)}>
                      <div style={{ width: 14, height: 14 }}><Icons.close /></div>
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </>
  );
}

      .catch(() => setLoading(false));
  }, []);

  const fmtDate = (s) => {
    if (!s) return '—';
    const d = new Date(s);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  };

  return (
    <>
      <div className="metrics-grid">
        <div className="metric">
          <div className="metric-head"><div className="metric-lbl">Total (30d)</div><div className="metric-ic"><Icons.alert /></div></div>
          <div className="metric-val amber">{loading ? '—' : items.length}</div>
          <div className="metric-foot"><span>questions escalated</span></div>
        </div>
        <div className="metric">
          <div className="metric-head"><div className="metric-lbl">Avg confidence</div><div className="metric-ic"><Icons.target /></div></div>
          <div className="metric-val">
            {loading || items.length === 0 ? '—' : Math.round(items.reduce((s, it) => s + (parseFloat(it.confidence_score) || 0), 0) / items.length * 100) + '%'}
          </div>
          <div className="metric-foot"><span>at time of escalation</span></div>
        </div>
        <div className="metric">
          <div className="metric-head"><div className="metric-lbl">Below 40%</div><div className="metric-ic"><Icons.refresh /></div></div>
          <div className="metric-val amber">
            {loading ? '—' : items.filter(it => parseFloat(it.confidence_score) < 0.40).length}
          </div>
          <div className="metric-foot"><span>very low confidence</span></div>
        </div>
        <div className="metric">
          <div className="metric-head"><div className="metric-lbl">Unique questions</div><div className="metric-ic"><Icons.message /></div></div>
          <div className="metric-val">
            {loading ? '—' : new Set(items.map(it => it.question)).size}
          </div>
          <div className="metric-foot"><span>distinct escalations</span></div>
        </div>
      </div>
      <div className="panel">
        <div className="panel-head">
          <div className="panel-title"><span className="panel-title-ic"><Icons.alert /></span>Escalation <em>log</em></div>
          <span className="panel-tag">LAST 30 DAYS · {loading ? '…' : items.length} ITEMS</span>
        </div>
        <div className="panel-body" style={{ padding: '4px 12px 12px' }}>
          {loading && <div style={{ padding: '24px 12px', color: 'var(--text-3)', fontSize: 13, textAlign: 'center' }}>Loading…</div>}
          {!loading && items.length === 0 && (
            <div style={{ padding: '24px 12px', color: 'var(--text-3)', fontSize: 13, textAlign: 'center' }}>No escalations in the last 30 days.</div>
          )}
          {!loading && items.map((it, i) => {
            const conf = it.confidence_score != null ? Math.round(parseFloat(it.confidence_score) * 100) : null;
            return (
              <div key={i} className="esc-row">
                <span className="esc-state open">ESCALATED</span>
                <div className="esc-main">
                  <div className="esc-q">{it.question}</div>
                  <div className="esc-meta">{fmtDate(it.created_at)}</div>
                </div>
                {conf != null && (
                  <div className="esc-conf">
                    <div className="esc-conf-lbl">CONF</div>
                    <div className={`esc-conf-v ${conf < 40 ? 'warn' : ''}`}>{conf}%</div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </>
  );
}

/* ============================================================
   ADMIN — FEEDBACK
   ============================================================ */
function AdminFeedback() {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    AdminAPI.getFeedback()
      .then(d => { setItems(Array.isArray(d) ? d : []); setLoading(false); })
      .catch(() => setLoading(false));
  }, []);

  const helpful = items.filter(it => it.rating === 'up' || it.rating === 1 || it.rating === true).length;
  const notHelpful = items.filter(it => it.rating === 'down' || it.rating === -1 || it.rating === false).length;
  const withComments = items.filter(it => it.comment && it.comment.trim()).length;

  const fmtDate = (s) => {
    if (!s) return '—';
    const d = new Date(s);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  };

  return (
    <>
      <div className="metrics-grid">
        <div className="metric">
          <div className="metric-head"><div className="metric-lbl">Helpful</div><div className="metric-ic"><Icons.thumbup /></div></div>
          <div className="metric-val green">{loading ? '—' : helpful}</div>
          <div className="metric-foot"><span>rated helpful (30d)</span></div>
        </div>
        <div className="metric">
          <div className="metric-head"><div className="metric-lbl">Not helpful</div><div className="metric-ic"><Icons.thumbdown /></div></div>
          <div className="metric-val amber">{loading ? '—' : notHelpful}</div>
          <div className="metric-foot"><span>rated not helpful</span></div>
        </div>
        <div className="metric">
          <div className="metric-head"><div className="metric-lbl">With comments</div><div className="metric-ic"><Icons.message /></div></div>
          <div className="metric-val">{loading ? '—' : withComments}</div>
          <div className="metric-foot"><span>detailed signal</span></div>
        </div>
        <div className="metric">
          <div className="metric-head"><div className="metric-lbl">Satisfaction</div><div className="metric-ic"><Icons.check /></div></div>
          <div className="metric-val green">
            {loading || items.length === 0 ? '—' : <>{Math.round((helpful / items.length) * 100)}<span className="pct">%</span></>}
          </div>
          <div className="metric-foot"><span>of rated responses</span></div>
        </div>
      </div>
      <div className="panel">
        <div className="panel-head">
          <div className="panel-title"><span className="panel-title-ic"><Icons.thumbup /></span>Recent <em>feedback</em></div>
          <span className="panel-tag">LAST 30 DAYS · {loading ? '…' : items.length} ITEMS</span>
        </div>
        <div className="panel-body" style={{ padding: '4px 12px 12px' }}>
          {loading && <div style={{ padding: '24px 12px', color: 'var(--text-3)', fontSize: 13, textAlign: 'center' }}>Loading…</div>}
          {!loading && items.length === 0 && (
            <div style={{ padding: '24px 12px', color: 'var(--text-3)', fontSize: 14, textAlign: 'center' }}>
              Feedback will appear here as users rate answers.
            </div>
          )}
          {!loading && items.map((it, i) => {
            const isUp = it.rating === 'up' || it.rating === 1 || it.rating === true;
            return (
              <div key={i} style={{ display: 'flex', gap: 12, alignItems: 'flex-start', padding: '10px 0', borderBottom: '1px solid var(--rule)' }}>
                <div style={{
                  width: 28, height: 28, borderRadius: '50%', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',
                  background: isUp ? 'var(--teal-soft, #e6f4f1)' : 'var(--signal-soft)',
                  color: isUp ? 'var(--teal)' : 'var(--signal)'
                }}>
                  <div style={{ width: 14, height: 14 }}>{isUp ? <Icons.thumbup /> : <Icons.thumbdown />}</div>
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, color: 'var(--text)', lineHeight: 1.4, marginBottom: 3 }}>{it.question}</div>
                  {it.comment && <div style={{ fontSize: 12, color: 'var(--text-2)', fontStyle: 'italic', lineHeight: 1.4 }}>"{it.comment}"</div>}
                </div>
                <span style={{ fontSize: 11, fontFamily: 'var(--mono)', color: 'var(--text-3)', flexShrink: 0 }}>{fmtDate(it.created_at)}</span>
              </div>
            );
          })}
        </div>
      </div>
    </>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App() {
  const [screen, setScreen] = useState(() => {
    try {
      const u = localStorage.getItem(USER_KEY);
      if (!u) return 'login';
      const seen = localStorage.getItem('siso_onboard_done');
      return seen ? 'chat' : 'onboard';
    } catch { return 'login'; }
  });
  const [user, setUser] = useState(() => {
    try {
      const u = localStorage.getItem(USER_KEY);
      return u ? JSON.parse(u) : null;
    } catch { return null; }
  });
  const [signedOut, setSignedOut] = useState(false);

  // Register the global 401 handler and validate stored session on load
  useEffect(() => {
    setOnUnauthorized(() => {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USER_KEY);
      setUser(null);
      setScreen('login');
      setSignedOut(false);
    });
    // Validate stored token — if expired or invalid, clear session now
    if (getToken()) {
      AuthAPI.validate().catch(() => {
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(USER_KEY);
        setUser(null);
        setScreen('login');
      });
    }
  }, []);

  const handleLogin = (data) => {
    const u = data.user || data;
    const tok = data.token || null;
    if (tok) localStorage.setItem(TOKEN_KEY, tok);
    localStorage.setItem(USER_KEY, JSON.stringify(u));
    setUser(u);
    setSignedOut(false);
    if (u.is_admin || u.role === 'admin') {
      setScreen('admin');
    } else {
      const seen = localStorage.getItem('siso_onboard_done');
      setScreen(seen ? 'chat' : 'onboard');
    }
  };

  const handleLogout = () => {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(USER_KEY);
    setUser(null);
    setScreen('login');
    setSignedOut(true);
  };

  const isAdmin = !!(user?.is_admin || user?.role === 'admin');

  return (
    <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
      <div style={{ display: screen === 'login' ? 'contents' : 'none' }}>
        <LoginScreen onLogin={handleLogin} signedOut={signedOut} onDismissSignedOut={() => setSignedOut(false)} />
      </div>
      <div style={{ display: screen === 'onboard' ? 'contents' : 'none' }}>
        <OnboardScreen user={user} onEnter={() => { localStorage.setItem('siso_onboard_done', '1'); setScreen('chat'); }} />
      </div>
      <div style={{ display: screen === 'chat' ? 'contents' : 'none' }}>
        <ChatScreen user={user}
          onAdmin={isAdmin ? () => setScreen('admin') : null}
          onLogout={handleLogout}
          onRewatch={() => setScreen('onboard')} />
      </div>
      <div style={{ display: screen === 'admin' ? 'contents' : 'none' }}>
        <AdminScreen user={user} onBack={() => setScreen('chat')} onLogout={handleLogout} onRewatch={() => setScreen('onboard')} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>

<style>
/* ============================================================
   SISO LIVE! · DESIGN SYSTEM
   Editorial-tech. Ink on cream. Serif italic accents.
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* Ink */
  --ink: #0B1320;
  --ink-2: #141C2E;
  --ink-3: #1F2940;
  --ink-soft: rgba(11,19,32,0.06);
  /* Paper */
  --paper: #F4F1EA;
  --paper-2: #EBE6D9;
  --paper-3: #FFFFFF;
  --paper-tinted: #FAF7F0;
  /* Rules */
  --rule: rgba(11,19,32,0.10);
  --rule-2: rgba(11,19,32,0.16);
  --rule-strong: rgba(11,19,32,0.28);
  /* Text */
  --text: #0B1320;
  --text-2: #4A5468;
  --text-3: #8B91A3;
  --text-on-ink: #F4F1EA;
  --text-on-ink-2: rgba(244,241,234,0.62);
  --text-on-ink-3: rgba(244,241,234,0.38);
  /* Signal */
  --teal: #15B79A;
  --teal-deep: #0E8B74;
  --teal-soft: rgba(21,183,154,0.10);
  --teal-soft-2: rgba(21,183,154,0.18);
  --gold: #C8A458;
  --gold-soft: rgba(200,164,88,0.12);
  --gold-soft-2: rgba(200,164,88,0.22);
  --signal: #2D5BFF;
  --signal-soft: rgba(45,91,255,0.10);
  --warn: #B5681C;
  --warn-soft: rgba(181,104,28,0.10);
  --error: #B43A38;
  --error-soft: rgba(180,58,56,0.10);
  --positive: #2E8C5B;
  /* Type */
  --serif: 'Instrument Serif', 'Times New Roman', Georgia, serif;
  --sans: 'Inter Tight', Inter, -apple-system, system-ui, sans-serif;
  --mono: 'Inter Tight', Inter, -apple-system, system-ui, sans-serif;
  /* Radii */
  --r-sm: 6px;
  --r: 10px;
  --r-lg: 16px;
  --r-xl: 22px;
  --r-2xl: 28px;
  /* Shadow */
  --shadow-card: 0 1px 0 rgba(11,19,32,0.04), 0 1px 2px rgba(11,19,32,0.04), 0 8px 24px -12px rgba(11,19,32,0.08);
  --shadow-lift: 0 1px 0 rgba(11,19,32,0.04), 0 4px 12px rgba(11,19,32,0.06), 0 24px 48px -16px rgba(11,19,32,0.14);
}

html, body, #root { height: 100%; width: 100%; }
body {
  font-family: var(--sans);
  background: var(--paper);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: 'ss01' on, 'cv11' on;
  letter-spacing: -0.005em;
}
button { font-family: var(--sans); cursor: pointer; border: none; outline: none; background: none; color: inherit; letter-spacing: inherit; }
input, textarea { font-family: var(--sans); outline: none; border: none; background: none; color: inherit; }
input::placeholder, textarea::placeholder { color: var(--text-3); }
::selection { background: rgba(21,183,154,0.25); color: var(--ink); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--rule-2); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--rule-strong); }

/* === Type primitives === */
.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-3);
}
.eyebrow.on-ink { color: var(--text-on-ink-2); }
.serif-italic { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }

/* === Animations === */
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.35; transform:scale(0.92); } }
@keyframes pulseDot { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
.fade-up { animation: fadeUp 0.45s cubic-bezier(.2,.7,.2,1) both; }
.fade-in { animation: fadeIn 0.35s ease both; }

/* ============================================================
   TOP NAV (shared chat + admin)
   ============================================================ */
.nav-top {
  background: var(--ink);
  padding: 0 22px;
  display: flex; align-items: center; justify-content: space-between;
  height: 54px; flex-shrink: 0;
  border-bottom: 1px solid rgba(244,241,234,0.06);
}
.nav-top-logo {
  display: flex; align-items: center; gap: 10px;
  color: var(--text-on-ink);
}
.nav-mark {
  width: 26px; height: 26px; border-radius: 7px;
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
}
.nav-wordmark {
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
  display: flex; align-items: baseline; gap: 6px;
}
.nav-wordmark .live {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 16px;
  color: var(--teal);
}
.nav-build {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-on-ink-3);
  padding-left: 12px;
  margin-left: 12px;
  border-left: 1px solid rgba(244,241,234,0.12);
}
.nav-links {
  display: flex; gap: 4px;
  background: rgba(244,241,234,0.06);
  border-radius: 999px;
  padding: 4px;
}
.nav-link {
  padding: 6px 16px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-on-ink-2);
  cursor: pointer;
  transition: all 0.18s ease;
  letter-spacing: -0.005em;
  white-space: nowrap;
}
.nav-link:hover { color: var(--text-on-ink); }
.nav-link.active {
  color: var(--ink);
  background: var(--paper);
  box-shadow: 0 1px 2px rgba(0,0,0,0.18);
}
.nav-right { display: flex; align-items: center; gap: 14px; }
.nav-status {
  display: flex; align-items: center; gap: 7px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--text-on-ink-2);
  padding: 4px 10px 4px 9px;
  border-radius: 999px;
  background: rgba(21,183,154,0.10);
  border: 1px solid rgba(21,183,154,0.24);
}
.nav-status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); animation: pulseDot 2s ease-in-out infinite; box-shadow: 0 0 6px rgba(21,183,154,0.6); }
.nav-user {
  display: flex; align-items: center; gap: 9px;
  font-size: 12.5px; color: var(--text-on-ink);
  padding: 4px 10px 4px 4px;
  border-radius: 999px;
  background: rgba(244,241,234,0.06);
  cursor: pointer;
  transition: background 0.15s;
}
.nav-user:hover { background: rgba(244,241,234,0.10); }
.nav-user-av {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 10.5px; font-weight: 500;
  color: var(--ink);
}

/* ============================================================
   LOGIN · editorial cream left, floating ink card right
   ============================================================ */
.login-screen {
  display: grid;
  grid-template-columns: 1.55fr 1fr;
  height: 100vh;
  background: var(--paper-tinted);
  position: relative;
  overflow: hidden;
}
.login-screen::before {
  /* soft orbit halo behind hero */
  content: '';
  position: absolute;
  top: 50%; left: 56%;
  width: 820px; height: 820px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background:
    radial-gradient(circle at 50% 50%, rgba(21,183,154,0.05) 0%, rgba(21,183,154,0) 55%),
    conic-gradient(from 200deg at 50% 50%, rgba(21,183,154,0.10), rgba(45,91,255,0.06), rgba(200,164,88,0.06), rgba(21,183,154,0.10));
  filter: blur(40px);
  opacity: 0.7;
  pointer-events: none;
}
.login-screen::after {
  /* fine orbit rings */
  content: '';
  position: absolute;
  top: 50%; left: 56%;
  width: 620px; height: 620px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1px solid rgba(21,183,154,0.18);
  box-shadow:
    inset 0 0 0 1px rgba(11,19,32,0),
    0 0 0 60px rgba(21,183,154,0.04);
  background:
    radial-gradient(circle, transparent 49%, rgba(21,183,154,0.10) 50%, transparent 51%) center/100% 100% no-repeat;
  pointer-events: none;
  opacity: 0.55;
}

/* ---- LEFT: editorial cream column ---- */
.login-left {
  position: relative;
  z-index: 2;
  padding: 40px 28px 32px 48px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  color: var(--text);
  overflow: hidden;
  min-width: 0;
}
.login-left-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px;
  min-width: 0;
  flex-wrap: wrap;
}
.login-lockup {
  display: flex; align-items: center; gap: 14px;
}
.login-lockup .org-mark {
  height: 22px;
  display: flex; align-items: center;
  padding-right: 4px;
}
.login-lockup .org-mark img {
  height: 100%;
  width: auto;
  display: block;
  /* white PNG → AbbVie navy via filter */
  filter: brightness(0) saturate(100%) invert(9%) sepia(40%) saturate(4200%) hue-rotate(218deg) brightness(70%) contrast(110%);
}
.login-lockup .lockup-sep {
  width: 1px; height: 26px;
  background: var(--rule-2);
}
.login-lockup .product {
  display: flex; align-items: center; gap: 10px;
}
.login-lockup .product .mark {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 2px 12px rgba(21,183,154,0.30);
}
.login-lockup .product .wm {
  font-size: 16px; font-weight: 600; letter-spacing: -0.01em;
  display: inline-flex; align-items: baseline; gap: 4px;
}
.login-lockup .product .wm em {
  font-family: var(--serif); font-style: italic; font-weight: 400;
  font-size: 19px; color: var(--teal-deep); margin-left: 1px;
}

.login-help {
  font-family: var(--sans); font-size: 13px;
  color: var(--text-3);
  display: inline-flex; align-items: baseline; gap: 8px;
  white-space: nowrap;
  flex-shrink: 0;
}
.login-help a {
  color: var(--text);
  text-decoration: none;
  border-bottom: 1px dotted var(--rule-strong);
  font-weight: 500;
}
.login-help a:hover { border-bottom-color: var(--teal-deep); color: var(--teal-deep); }

.login-hero {
  align-self: center;
  max-width: 560px;
  padding-top: 8px;
}
.login-pill {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 7px 16px 7px 14px;
  border: 1px solid var(--rule-2);
  background: rgba(255,255,255,0.6);
  border-radius: 999px;
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: -0.005em;
  color: var(--text-2);
  margin-bottom: 36px;
  backdrop-filter: blur(6px);
}
.login-pill .pulse-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--teal); animation: pulseDot 2s infinite;
  box-shadow: 0 0 8px rgba(21,183,154,0.6);
}
.login-headline {
  font-family: var(--sans);
  font-size: 72px;
  font-weight: 400;
  line-height: 1.02;
  letter-spacing: -0.035em;
  color: var(--ink);
  margin-bottom: 30px;
  max-width: 520px;
}
.login-headline .accent {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  color: var(--teal-deep);
  letter-spacing: -0.02em;
}
.login-sub {
  font-size: 16px;
  line-height: 1.6;
  color: var(--text-2);
  max-width: 460px;
  font-weight: 400;
  margin-bottom: 40px;
}

.login-feats {
  display: grid;
  grid-template-columns: repeat(3, minmax(120px, 1fr));
  gap: 18px;
  align-items: start;
  min-width: 0;
}
.login-feat { min-width: 0; }
.login-feat .ic {
  width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 14px;
  background: var(--paper-3);
  border: 1px solid var(--rule);
}
.login-feat.f-1 .ic { background: rgba(46,140,91,0.10); color: var(--positive); border-color: rgba(46,140,91,0.20); }
.login-feat.f-2 .ic { background: rgba(150,124,210,0.12); color: #6B5BB0; border-color: rgba(107,91,176,0.22); }
.login-feat.f-3 .ic { background: rgba(45,91,255,0.10); color: var(--signal); border-color: rgba(45,91,255,0.20); }
.login-feat h5 {
  font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
  color: var(--ink); margin-bottom: 4px;
}
.login-feat p {
  font-size: 12.5px; color: var(--text-2); line-height: 1.5;
}

.login-left-foot {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.04em;
  color: var(--text-3);
  padding-top: 24px;
  display: flex; align-items: center; gap: 14px;
}
.login-left-foot span { display: flex; align-items: center; gap: 6px; }
.login-left-foot .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--rule-strong); }

/* hero photo · inline at bottom of hero, beside the feature cards */
.login-bottom-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 24px;
  min-width: 0;
}
.login-hero-photo {
  width: 180px;
  max-width: 180px;
  flex-shrink: 0;
  pointer-events: none;
  align-self: end;
}
.login-hero-photo img {
  width: 100%;
  height: auto;
  display: block;
  mask-image: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.55) 14%, rgba(0,0,0,1) 38%);
  -webkit-mask-image: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.55) 14%, rgba(0,0,0,1) 38%);
}

/* Narrow viewports · hide the photo so feats keep their room */
@media (max-width: 1180px) {
  .login-bottom-row { grid-template-columns: 1fr; }
  .login-hero-photo { display: none; }
}

/* ---- RIGHT: floating dark form card ---- */
.login-right {
  position: relative;
  z-index: 3;
  padding: 32px 36px 32px 0;
  display: flex; flex-direction: column;
  align-items: stretch;
  justify-content: center;
}
.login-card {
  background: var(--ink);
  color: var(--text-on-ink);
  border-radius: 22px;
  padding: 48px 44px 36px;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.04) inset,
    0 30px 80px -20px rgba(11,19,32,0.45),
    0 8px 24px -8px rgba(11,19,32,0.30);
  border: 1px solid rgba(244,241,234,0.06);
  position: relative;
  overflow: hidden;
  height: min(86vh, 760px);
  display: flex; flex-direction: column;
}
.login-card::before {
  content: '';
  position: absolute;
  top: -80px; right: -80px;
  width: 280px; height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(21,183,154,0.10) 0%, transparent 65%);
  pointer-events: none;
}
.login-card-inner {
  display: flex; flex-direction: column;
  flex: 1;
  position: relative; z-index: 1;
}
.login-h {
  font-family: var(--sans);
  font-size: 40px;
  font-weight: 500;
  letter-spacing: -0.035em;
  line-height: 1.05;
  color: var(--text-on-ink);
  margin-bottom: 10px;
}
.login-h em {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  color: var(--teal);
  letter-spacing: -0.025em;
}
.login-p {
  font-size: 14.5px;
  color: var(--text-on-ink-2);
  line-height: 1.55;
  margin-bottom: 32px;
}
.field { display: flex; flex-direction: column; gap: 9px; margin-bottom: 18px; }
.field-label {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-on-ink-2);
  display: flex; justify-content: space-between; align-items: baseline;
}
.field-label .hint {
  color: var(--text-on-ink-3);
  text-transform: none;
  letter-spacing: 0;
  font-family: var(--sans);
  font-size: 12px;
  cursor: pointer;
}
.field-label .hint:hover { color: var(--teal); }
.field-inp {
  height: 50px;
  background: rgba(244,241,234,0.04);
  border: 1px solid rgba(244,241,234,0.10);
  border-radius: 10px;
  padding: 0 16px;
  font-size: 14.5px;
  color: var(--text-on-ink);
  width: 100%;
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  letter-spacing: -0.005em;
}
.field-inp::placeholder { color: var(--text-on-ink-3); }
.field-inp:hover { border-color: rgba(244,241,234,0.18); background: rgba(244,241,234,0.06); }
.field-inp:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 4px rgba(21,183,154,0.12);
  background: rgba(244,241,234,0.06);
}

.btn-primary {
  height: 54px;
  background: var(--teal);
  color: var(--ink);
  border-radius: 10px;
  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: -0.005em;
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  transition: transform 0.1s ease, background 0.15s, box-shadow 0.15s;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.25),
    0 6px 18px -6px rgba(21,183,154,0.55);
  padding: 0 22px;
  margin-top: 10px;
  position: relative;
}
.btn-primary:hover:not(:disabled) { background: #1DCBA9; }
.btn-primary:active:not(:disabled) { transform: translateY(1px); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-primary .arrow {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%;
  background: rgba(11,19,32,0.92);
  color: var(--teal);
  transition: transform 0.2s ease;
}
.btn-primary:hover:not(:disabled) .arrow { transform: translateX(3px); }

.divider {
  display: flex; align-items: center; gap: 14px;
  margin: 22px 0 18px;
}
.divider-line { flex: 1; height: 1px; background: rgba(244,241,234,0.10); }
.divider-text {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-on-ink-3);
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.btn-sso {
  height: 50px;
  border: 1px solid rgba(244,241,234,0.16);
  border-radius: 10px;
  background: transparent;
  color: var(--text-on-ink);
  font-size: 14px;
  font-weight: 500;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: background 0.15s, border-color 0.15s;
  width: 100%;
}
.btn-sso:hover { border-color: rgba(244,241,234,0.32); background: rgba(244,241,234,0.04); }

.login-error {
  font-size: 13px;
  color: #FF9F9D;
  background: rgba(180,58,56,0.12);
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid rgba(180,58,56,0.28);
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 18px;
}

.login-card-foot {
  margin-top: auto;
  padding-top: 28px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--text-on-ink-3);
  letter-spacing: 0.06em;
  display: flex; align-items: center; gap: 10px;
}
.login-card-foot .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--text-on-ink-3); opacity: 0.6; }

.login-right-foot {
  padding: 14px 8px 0;
  display: flex; justify-content: flex-end;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--text-3);
  letter-spacing: 0.04em;
}

/* ============================================================
   ONBOARDING
   ============================================================ */
.onboard-screen {
  min-height: 100vh; height: 100vh; overflow-y: auto;
  background: var(--paper);
  display: flex; flex-direction: column; align-items: center;
  padding: 48px 32px;
}
.onboard-inner { max-width: 780px; width: 100%; }
.onboard-top {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 64px;
}
.onboard-brand { display: flex; align-items: center; gap: 10px; }
.onboard-brand .mark {
  width: 28px; height: 28px; border-radius: 7px;
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
  color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
}
.onboard-brand .name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.onboard-brand .name em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--teal-deep); margin-left: 1px; }
.onboard-skip-link {
  font-family: var(--mono); font-size: 11px;
  color: var(--text-2); cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px;
  transition: background 0.15s;
}
.onboard-skip-link:hover { background: var(--ink-soft); color: var(--text); }

.onboard-hero { margin-bottom: 36px; }
.onboard-eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 10px;
}
.onboard-eyebrow .step {
  background: var(--ink); color: var(--paper);
  padding: 2px 8px; border-radius: 4px;
  font-size: 10px; letter-spacing: 0.12em;
}
.onboard-h {
  font-size: 44px;
  line-height: 1.08;
  font-weight: 500;
  letter-spacing: -0.025em;
  margin-bottom: 16px;
  max-width: 620px;
}
.onboard-h em { font-family: var(--serif); font-style: italic; font-weight: 400; }
.onboard-p {
  font-size: 15.5px;
  color: var(--text-2);
  line-height: 1.55;
  max-width: 540px;
}

/* video card */
.video-box {
  position: relative;
  border-radius: var(--r-xl);
  overflow: hidden;
  background: var(--ink);
  color: var(--text-on-ink);
  cursor: pointer;
  margin-bottom: 28px;
  border: 1px solid var(--rule-2);
  box-shadow: var(--shadow-lift);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.video-box:hover { transform: translateY(-2px); }
.video-thumb {
  aspect-ratio: 16 / 9;
  background:
    radial-gradient(ellipse at 30% 40%, rgba(21,183,154,0.18) 0%, transparent 50%),
    radial-gradient(ellipse at 75% 70%, rgba(200,164,88,0.10) 0%, transparent 50%),
    var(--ink);
  position: relative;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.video-thumb::before {
  content: ''; position: absolute; inset: 0;
  background-image: radial-gradient(rgba(244,241,234,0.05) 1px, transparent 1px);
  background-size: 20px 20px;
  mask-image: linear-gradient(180deg, transparent 0%, black 40%, black 60%, transparent 100%);
}
.video-play {
  width: 84px; height: 84px; border-radius: 50%;
  background: rgba(244,241,234,0.05);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(244,241,234,0.20);
  display: flex; align-items: center; justify-content: center;
  position: relative;
  transition: transform 0.2s ease;
}
.video-box:hover .video-play { transform: scale(1.05); }
.video-play::before {
  content: ''; position: absolute; inset: -8px;
  border-radius: 50%;
  border: 1px solid rgba(21,183,154,0.30);
}
.video-play-inner {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--teal);
  color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px rgba(21,183,154,0.40);
}
.video-duration {
  position: absolute; top: 18px; left: 18px;
  font-family: var(--mono); font-size: 10.5px;
  color: var(--text-on-ink-2);
  background: rgba(11,19,32,0.5); backdrop-filter: blur(8px);
  padding: 4px 10px; border-radius: 999px;
  border: 1px solid rgba(244,241,234,0.10);
  letter-spacing: 0.08em;
}
.video-tag {
  position: absolute; top: 18px; right: 18px;
  font-family: var(--mono); font-size: 10.5px;
  color: var(--teal);
  background: rgba(21,183,154,0.10); backdrop-filter: blur(8px);
  padding: 4px 10px; border-radius: 999px;
  border: 1px solid rgba(21,183,154,0.30);
  letter-spacing: 0.08em;
  display: flex; align-items: center; gap: 6px;
}
.video-meta-bar {
  padding: 18px 22px;
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid rgba(244,241,234,0.08);
}
.video-meta-title {
  font-size: 15px; font-weight: 500; color: var(--text-on-ink);
  display: flex; align-items: center; gap: 10px;
}
.video-meta-title em { font-family: var(--serif); font-style: italic; font-weight: 400; }
.video-meta-sub { font-family: var(--mono); font-size: 11px; color: var(--text-on-ink-3); letter-spacing: 0.06em; margin-top: 4px; }
.video-skip {
  font-family: var(--mono); font-size: 11px;
  color: var(--text-on-ink-2);
  cursor: pointer;
  padding: 6px 12px; border-radius: 999px;
  border: 1px solid rgba(244,241,234,0.16);
  transition: background 0.15s;
}
.video-skip:hover { background: rgba(244,241,234,0.08); }

.onboard-cards {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  margin-bottom: 36px;
}
.onboard-card {
  padding: 22px;
  background: var(--paper-3);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  position: relative; overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.onboard-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); }
.onboard-card .num {
  position: absolute; top: 18px; right: 22px;
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--text-3);
}
.onboard-card .ic {
  width: 36px; height: 36px; border-radius: 9px;
  background: var(--ink); color: var(--teal);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 18px;
}
.onboard-card h4 {
  font-size: 16px; font-weight: 500;
  margin-bottom: 6px;
  letter-spacing: -0.01em;
}
.onboard-card h4 em { font-family: var(--serif); font-style: italic; font-weight: 400; }
.onboard-card p { font-size: 13px; color: var(--text-2); line-height: 1.55; }

.onboard-cta-row {
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 24px; border-top: 1px solid var(--rule);
}
.onboard-cta-meta { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.onboard-cta-meta b { font-weight: 500; color: var(--text); }

/* ============================================================
   CHAT
   ============================================================ */
.app-shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.chat-screen { display: grid; grid-template-columns: 272px 1fr; flex: 1; overflow: hidden; background: var(--paper); }
.sidebar {
  border-right: 1px solid var(--rule);
  display: flex; flex-direction: column;
  background: var(--paper-tinted);
  overflow: hidden;
}
.sidebar-top {
  padding: 18px 18px 16px;
  border-bottom: 1px solid var(--rule);
}
.new-conv-btn {
  width: 100%;
  height: 38px;
  background: var(--paper-3);
  border: 1px solid var(--rule-2);
  border-radius: var(--r);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px 0 14px;
  font-size: 13px;
  color: var(--text);
  font-weight: 500;
  transition: border-color 0.15s, background 0.15s;
}
.new-conv-btn:hover { border-color: var(--ink); background: var(--paper-3); }
.new-conv-btn .kbd {
  font-family: var(--mono); font-size: 10px;
  color: var(--text-3);
  padding: 2px 6px; border-radius: 4px;
  border: 1px solid var(--rule-2);
}
.sidebar-body {
  flex: 1; padding: 14px 12px; overflow-y: auto;
  display: flex; flex-direction: column;
}
.sidebar-sec {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 14px 8px 8px;
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-sec .cnt {
  font-family: var(--mono); font-size: 10px;
  color: var(--text-3);
  padding: 1px 6px; border-radius: 999px;
  border: 1px solid var(--rule);
  letter-spacing: 0;
  background: var(--paper-3);
}
.sidebar-item {
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-2);
  cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  transition: background 0.12s, color 0.12s;
  position: relative;
}
.sidebar-item:hover { background: var(--ink-soft); color: var(--text); }
.sidebar-item.active {
  background: var(--ink); color: var(--text-on-ink);
}
.sidebar-item.active .si-ic { color: var(--teal); }
.sidebar-item.active .si-meta { color: var(--text-on-ink-3); }
.si-ic { width: 15px; height: 15px; flex-shrink: 0; }
.si-meta {
  margin-left: auto;
  font-family: var(--mono); font-size: 10px;
  color: var(--text-3);
}

.sidebar-chips { display: flex; flex-direction: column; gap: 6px; padding: 4px 0; }
.sidebar-chip {
  padding: 10px 12px;
  border: 1px solid var(--rule);
  background: var(--paper-3);
  border-radius: 10px;
  font-size: 12.5px;
  color: var(--text);
  cursor: pointer;
  line-height: 1.45;
  transition: background 0.12s, border-color 0.12s, transform 0.12s;
  display: flex; gap: 8px; align-items: flex-start;
  letter-spacing: -0.005em;
}
.sidebar-chip:hover { border-color: var(--ink); transform: translateX(2px); }
.sidebar-chip .chip-mark {
  font-family: var(--mono); font-size: 10px; color: var(--text-3); flex-shrink: 0; padding-top: 1px;
}

.sidebar-footer {
  padding: 14px 18px;
  border-top: 1px solid var(--rule);
  display: flex; align-items: center; gap: 11px;
  background: var(--paper-3);
}
.user-av-side {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--ink); color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  flex-shrink: 0;
  position: relative;
}
.user-av-side::after {
  content: ''; position: absolute; bottom: 0; right: 0;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--teal);
  border: 2px solid var(--paper-3);
}
.user-info-side { flex: 1; min-width: 0; }
.user-info-side .n { font-size: 13px; font-weight: 500; color: var(--text); letter-spacing: -0.005em; }
.user-info-side .r { font-family: var(--mono); font-size: 10px; color: var(--text-3); letter-spacing: 0.04em; }
.user-info-side .chev { color: var(--text-3); }

/* chat area */
.chat-area { display: flex; flex-direction: column; background: var(--paper); overflow: hidden; }
.chat-topbar {
  padding: 14px 28px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
  border-bottom: 1px solid var(--rule);
  background: var(--paper);
  gap: 16px;
  min-width: 0;
}
.chat-topbar-left { min-width: 0; flex-shrink: 1; overflow: hidden; }
.chat-topbar-left-row { display: flex; align-items: center; gap: 12px; flex-shrink: 1; min-width: 0; }
.chat-topbar-title {
  font-size: 14.5px; font-weight: 500; color: var(--text);
  display: flex; align-items: center; gap: 10px;
  white-space: nowrap;
}
.chat-topbar-title em { font-family: var(--serif); font-style: italic; font-weight: 400; }
.chat-topbar-meta {
  font-family: var(--mono); font-size: 11px;
  color: var(--text-3);
  padding-left: 12px;
  border-left: 1px solid var(--rule);
  white-space: nowrap;
}
.verified-badge {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text);
  background: var(--paper-3);
  border: 1px solid var(--rule-2);
  padding: 5px 12px;
  border-radius: 999px;
  letter-spacing: 0.02em;
  white-space: nowrap;
  flex-shrink: 0;
}
.verified-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--teal);
  box-shadow: 0 0 8px rgba(21,183,154,0.6);
}
.chat-actions { display: flex; gap: 6px; }
.chat-action-btn {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2);
  border: 1px solid transparent;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.chat-action-btn:hover { background: var(--paper-3); border-color: var(--rule-2); color: var(--text); }

.messages {
  flex: 1; overflow-y: auto;
  padding: 28px 28px 12px;
  display: flex; flex-direction: column; gap: 24px;
}
.messages-inner { max-width: 760px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 24px; }

/* AI message */
.msg-ai { animation: fadeUp 0.4s cubic-bezier(.2,.7,.2,1) both; }
.msg-ai-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 8px;
  padding-left: 4px;
}
.msg-ai-av {
  width: 26px; height: 26px; border-radius: 7px;
  background: var(--ink); color: var(--teal);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
}
.msg-ai-name { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.msg-ai-name em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--teal-deep); margin-left: 1px; }
.msg-ai-time { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); letter-spacing: 0.04em; }
.msg-ai-time::before { content: '·'; margin: 0 8px; color: var(--text-3); }

.ai-card {
  background: var(--paper-3);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}
.ai-card-body {
  padding: 18px 20px 16px;
  font-size: 14.5px;
  line-height: 1.65;
  color: var(--text);
  letter-spacing: -0.005em;
}
.ai-card-body.low-conf { color: var(--text-2); }
.ai-card-body strong { font-weight: 600; }
.ai-card-foot {
  border-top: 1px solid var(--rule);
  padding: 10px 14px 10px 20px;
  display: flex; align-items: center; gap: 14px;
  background: var(--paper-tinted);
  flex-wrap: wrap;
}
.conf-gauge { display: flex; align-items: center; gap: 8px; }
.conf-arc {
  width: 22px; height: 22px;
  border-radius: 50%;
  flex-shrink: 0;
  position: relative;
}
.conf-arc-inner {
  position: absolute; inset: 3px;
  border-radius: 50%;
  background: var(--paper-3);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 8.5px; font-weight: 500;
  color: var(--text);
}
.conf-text {
  font-family: var(--mono); font-size: 11px;
  color: var(--text-2);
  display: flex; align-items: baseline; gap: 5px;
}
.conf-text b { color: var(--text); font-weight: 500; }
.conf-text.warn b { color: var(--warn); }

.source-chip {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: 11px;
  color: var(--text-2);
  padding: 4px 10px 4px 8px;
  border-radius: 999px;
  background: var(--paper-3);
  border: 1px solid var(--rule);
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  letter-spacing: -0.005em;
}
.source-chip:hover { border-color: var(--rule-strong); background: var(--paper); }
.source-chip .doc-mark {
  width: 14px; height: 14px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3);
}
.source-chip .ext { color: var(--text-3); }

.msg-foot-meta {
  margin-left: auto;
  display: flex; align-items: center; gap: 10px;
}
.foot-meta-pill {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--text-3);
  letter-spacing: 0.02em;
}
.foot-meta-sep { color: var(--text-3); font-family: var(--mono); }

/* feedback row */
.feedback-row {
  display: flex; align-items: center; gap: 8px;
  margin-top: 10px;
  padding-left: 4px;
}
.fb-lbl {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--text-3);
  letter-spacing: 0.04em;
}
.fb-btn {
  width: 30px; height: 30px;
  border-radius: 8px;
  border: 1px solid var(--rule-2);
  background: var(--paper-3);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2);
  transition: all 0.15s;
}
.fb-btn:hover { border-color: var(--ink); color: var(--text); }
.fb-btn.up-on {
  background: var(--teal-soft);
  border-color: var(--teal);
  color: var(--teal-deep);
}
.fb-btn.dn-on {
  background: var(--error-soft);
  border-color: var(--error);
  color: var(--error);
}
.fb-thanks {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--teal-deep);
  display: inline-flex; align-items: center; gap: 6px;
  animation: fadeIn 0.25s ease;
}
.fb-comment-box {
  margin-top: 10px;
  padding-left: 4px;
  animation: fadeUp 0.25s ease;
}
.fb-comment-box textarea {
  width: 100%;
  max-width: 460px;
  border: 1px solid var(--rule-2);
  border-radius: var(--r);
  padding: 12px 14px;
  font-size: 13px;
  color: var(--text);
  background: var(--paper-3);
  resize: none; height: 72px;
  transition: border-color 0.15s, box-shadow 0.15s;
  line-height: 1.5;
}
.fb-comment-box textarea:focus { border-color: var(--ink); box-shadow: 0 0 0 4px rgba(11,19,32,0.06); }
.fb-submit {
  margin-top: 8px;
  padding: 7px 16px;
  border-radius: 999px;
  background: var(--ink); color: var(--paper);
  font-size: 12px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
}
.fb-submit:hover { background: var(--ink-2); }

/* nudge · warm/gold */
.nudge {
  margin-top: 10px;
  padding: 11px 14px 11px 12px;
  border: 1px solid var(--gold-soft-2);
  border-left: 3px solid var(--gold);
  background: var(--gold-soft);
  border-radius: var(--r);
  font-size: 13px;
  color: var(--text);
  display: flex; align-items: center; gap: 10px;
  cursor: pointer;
  transition: background 0.15s;
  line-height: 1.5;
}
.nudge:hover { background: rgba(200,164,88,0.16); }
.nudge-ic {
  width: 18px; height: 18px;
  color: var(--gold);
  flex-shrink: 0;
}
.nudge em { font-family: var(--serif); font-style: italic; font-weight: 400; }
.nudge .arr {
  margin-left: auto;
  font-family: var(--mono); font-size: 10.5px;
  color: var(--text-2);
  letter-spacing: 0.04em;
}

/* escalate · supportive blue */
.escalate-card {
  margin-top: 10px;
  padding: 14px 16px;
  border: 1px solid var(--rule);
  background: var(--paper-3);
  border-radius: var(--r-lg);
  display: flex; align-items: flex-start; gap: 12px;
}
.escalate-ic {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--signal-soft); color: var(--signal);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.escalate-body { flex: 1; }
.escalate-title { font-size: 13px; font-weight: 600; letter-spacing: -0.005em; margin-bottom: 3px; }
.escalate-title em { font-family: var(--serif); font-style: italic; font-weight: 400; }
.escalate-desc { font-size: 12.5px; color: var(--text-2); line-height: 1.5; }
.escalate-btn {
  margin-left: auto; flex-shrink: 0;
  font-size: 12px; font-weight: 500;
  padding: 7px 14px;
  border-radius: 999px;
  background: var(--ink); color: var(--paper);
  display: inline-flex; align-items: center; gap: 6px;
}
.escalate-btn:hover { background: var(--ink-2); }

/* user message */
.msg-user {
  align-self: flex-end;
  max-width: 78%;
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  animation: fadeUp 0.4s cubic-bezier(.2,.7,.2,1) both;
}
.bubble-user {
  padding: 12px 16px;
  background: var(--ink);
  color: var(--text-on-ink);
  border-radius: 18px 18px 6px 18px;
  font-size: 14px;
  line-height: 1.55;
  letter-spacing: -0.005em;
  box-shadow: 0 1px 2px rgba(11,19,32,0.20);
}
.msg-user-meta {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--text-3);
  padding-right: 4px;
}

/* typing */
.typing-bubble {
  display: flex; align-items: center; gap: 5px;
  padding: 18px 20px;
}
.typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); animation: pulse 1.2s infinite; }
.typing-dot:nth-child(2) { animation-delay: 0.18s; }
.typing-dot:nth-child(3) { animation-delay: 0.36s; }
.typing-label {
  font-family: var(--mono); font-size: 11px;
  color: var(--text-3);
  margin-left: 8px;
  letter-spacing: 0.04em;
}

/* chat input */
.chat-input-area {
  padding: 12px 28px 22px;
  flex-shrink: 0;
}
.chat-input-wrap { max-width: 760px; margin: 0 auto; width: 100%; }
.chat-input-box {
  display: flex; align-items: center; gap: 10px;
  border: 1px solid var(--rule-2);
  border-radius: 16px;
  padding: 8px 8px 8px 16px;
  background: var(--paper-3);
  transition: border-color 0.15s, box-shadow 0.15s;
  box-shadow: var(--shadow-card);
}
.chat-input-box:focus-within { border-color: var(--ink); box-shadow: 0 0 0 4px rgba(11,19,32,0.05), var(--shadow-card); }
.chat-input-prefix { color: var(--text-3); display: flex; align-items: center; }
.chat-input-box input {
  flex: 1;
  font-size: 14px;
  color: var(--text);
  padding: 8px 0;
  letter-spacing: -0.005em;
}
.chat-input-actions { display: flex; align-items: center; gap: 4px; }
.input-action-btn {
  width: 34px; height: 34px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2);
  transition: background 0.15s, color 0.15s;
}
.input-action-btn:hover { background: var(--ink-soft); color: var(--text); }
.send-btn {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--ink);
  color: var(--teal);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, transform 0.1s, opacity 0.15s;
  flex-shrink: 0;
}
.send-btn:hover:not(:disabled) { background: var(--ink-2); }
.send-btn:active:not(:disabled) { transform: scale(0.95); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; background: var(--paper-2); color: var(--text-3); }

.chat-input-foot {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 10px;
  font-family: var(--mono); font-size: 10.5px;
  color: var(--text-3);
  padding: 0 4px;
  letter-spacing: 0.04em;
}
.chat-input-foot .left { display: flex; align-items: center; gap: 14px; }
.chat-input-foot .left span { display: flex; align-items: center; gap: 5px; }
.chat-input-foot .kbd {
  font-family: var(--mono); font-size: 10px;
  color: var(--text-2);
  padding: 1px 5px; border-radius: 3px;
  border: 1px solid var(--rule);
  background: var(--paper-3);
  letter-spacing: 0;
}

/* ============================================================
   ADMIN
   ============================================================ */
.admin-screen { display: grid; grid-template-columns: 232px 1fr; flex: 1; overflow: hidden; background: var(--paper); }
.admin-sidebar {
  background: var(--paper-tinted);
  border-right: 1px solid var(--rule);
  padding: 18px 14px;
  display: flex; flex-direction: column;
  overflow-y: auto;
}
.admin-context {
  padding: 10px 12px 14px;
  margin-bottom: 6px;
  border-bottom: 1px solid var(--rule);
}
.admin-context .label {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 4px;
}
.admin-context .org {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px; font-weight: 500; letter-spacing: -0.005em;
}
.admin-context .badge {
  font-family: var(--mono); font-size: 9.5px;
  background: var(--ink); color: var(--teal);
  padding: 2px 8px; border-radius: 999px;
  letter-spacing: 0.10em;
}

.admin-sec {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-3);
  padding: 14px 10px 6px;
}
.admin-item {
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-2);
  cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  transition: background 0.12s, color 0.12s;
  letter-spacing: -0.005em;
  position: relative;
}
.admin-item:hover { background: var(--ink-soft); color: var(--text); }
.admin-item.active {
  background: var(--ink); color: var(--text-on-ink);
}
.admin-item.active .ai-ic { color: var(--teal); }
.admin-item .ai-ic { width: 16px; height: 16px; flex-shrink: 0; }
.admin-item .ai-cnt {
  margin-left: auto;
  font-family: var(--mono); font-size: 10px;
  color: var(--text-3);
  padding: 1px 6px; border-radius: 999px;
  background: var(--paper-3);
  border: 1px solid var(--rule);
}
.admin-item.active .ai-cnt { background: rgba(244,241,234,0.10); border-color: rgba(244,241,234,0.16); color: var(--text-on-ink); }

.admin-footer { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--rule); }

/* admin main */
.admin-main {
  padding: 24px 32px 40px;
  overflow-y: auto;
  display: flex; flex-direction: column;
  gap: 22px;
  background: var(--paper);
}
.admin-header {
  display: flex; align-items: flex-end; justify-content: space-between;
  padding-bottom: 6px;
}
.admin-header-l { display: flex; flex-direction: column; gap: 6px; }
.admin-header h2 {
  font-size: 30px; font-weight: 500;
  letter-spacing: -0.025em;
  line-height: 1.1;
}
.admin-header h2 em { font-family: var(--serif); font-style: italic; font-weight: 400; }
.admin-header-meta {
  font-family: var(--mono); font-size: 11px;
  color: var(--text-3);
  letter-spacing: 0.04em;
}
.admin-header-r { display: flex; align-items: center; gap: 10px; }
.range-pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--paper-3);
  border: 1px solid var(--rule-2);
  padding: 7px 12px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: border-color 0.15s;
}
.range-pill:hover { border-color: var(--rule-strong); }
.range-pill-mono { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
.export-btn {
  padding: 7px 14px;
  border-radius: 999px;
  background: var(--ink); color: var(--paper);
  font-size: 12.5px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 7px;
}
.export-btn:hover { background: var(--ink-2); }

/* metrics */
.metrics-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
}
.metric {
  background: var(--paper-3);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  padding: 18px 18px 16px;
  position: relative;
  overflow: hidden;
}
.metric-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.metric-lbl {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-3);
  white-space: nowrap;
}
.metric-ic {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3);
}
.metric-val {
  font-family: var(--sans);
  font-size: 36px; font-weight: 500;
  letter-spacing: -0.03em;
  color: var(--text);
  line-height: 1;
  display: flex; align-items: baseline; gap: 6px;
}
.metric-val .pct { font-size: 18px; color: var(--text-2); font-weight: 400; }
.metric-val.green { color: var(--positive); }
.metric-val.amber { color: var(--warn); }
.metric-foot {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 12px;
  font-family: var(--mono); font-size: 11px;
  color: var(--text-3);
  letter-spacing: 0.02em;
}
.metric-trend {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-family: var(--mono); font-size: 10.5px;
  font-weight: 500;
}
.metric-trend.up { color: var(--positive); background: rgba(46,140,91,0.08); }
.metric-trend.down { color: var(--warn); background: var(--warn-soft); }
.metric-spark {
  position: absolute; right: 14px; bottom: 14px; opacity: 0.5;
  pointer-events: none;
}

.two-col { display: grid; grid-template-columns: 1.1fr 1fr; gap: 14px; }

.panel {
  background: var(--paper-3);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  padding: 0;
  overflow: hidden;
}
.panel-head {
  padding: 16px 20px 14px;
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: space-between;
}
.panel-title {
  font-size: 14px; font-weight: 500;
  letter-spacing: -0.005em;
  display: flex; align-items: center; gap: 9px;
}
.panel-title em { font-family: var(--serif); font-style: italic; font-weight: 400; }
.panel-title-ic { width: 16px; height: 16px; color: var(--text-3); }
.panel-tag {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--text-3);
  letter-spacing: 0.04em;
}
.panel-body { padding: 8px 12px 12px; }

.q-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 10px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.12s;
}
.q-row:hover { background: var(--paper-tinted); }
.q-rank {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--text-3);
  width: 18px;
  letter-spacing: 0.04em;
}
.q-text { color: var(--text); flex: 1; letter-spacing: -0.005em; }
.q-bar {
  width: 60px; height: 4px; border-radius: 2px;
  background: var(--paper-2); overflow: hidden;
  flex-shrink: 0;
}
.q-bar-fill { height: 100%; background: var(--ink); border-radius: 2px; }
.q-count {
  font-family: var(--mono); font-size: 11.5px; font-weight: 500;
  color: var(--text);
  width: 38px; text-align: right;
}

.gap-row {
  padding: 10px 12px;
  background: var(--paper-tinted);
  border: 1px solid var(--rule);
  border-radius: 8px;
  margin-bottom: 6px;
  font-size: 13px;
  display: flex; align-items: center; gap: 11px;
  cursor: pointer;
  transition: border-color 0.12s;
}
.gap-row:last-child { margin-bottom: 0; }
.gap-row:hover { border-color: var(--warn); }
.gap-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--warn);
  flex-shrink: 0;
  box-shadow: 0 0 8px rgba(181,104,28,0.4);
}
.gap-text { flex: 1; color: var(--text); letter-spacing: -0.005em; }
.gap-count {
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  color: var(--warn);
  padding: 2px 8px;
  background: var(--warn-soft);
  border-radius: 999px;
}
.gap-action {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--text-3);
  letter-spacing: 0.04em;
}

.bar-row {
  display: grid;
  grid-template-columns: 160px 1fr 48px;
  align-items: center;
  gap: 14px;
  padding: 10px 8px;
  font-size: 13px;
  border-bottom: 1px dashed var(--rule);
}
.bar-row:last-child { border-bottom: none; }
.bar-lbl { color: var(--text); letter-spacing: -0.005em; display: flex; align-items: center; gap: 8px; }
.bar-lbl .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.bar-lbl .dot.warn { background: var(--warn); }
.bar-track {
  height: 8px; background: var(--paper-2); border-radius: 4px; overflow: hidden;
  position: relative;
}
.bar-track::after {
  content: ''; position: absolute;
  left: 90%; top: -2px; bottom: -2px;
  width: 1px; background: var(--rule-strong);
}
.bar-fill {
  height: 100%; border-radius: 4px;
  background: linear-gradient(90deg, var(--teal-deep) 0%, var(--teal) 100%);
  transition: width 0.8s cubic-bezier(.2,.7,.2,1);
}
.bar-fill.warn { background: linear-gradient(90deg, var(--warn) 0%, #DA8A36 100%); }
.bar-pct {
  font-family: var(--mono); font-size: 12px; font-weight: 500;
  color: var(--text);
  text-align: right;
}
.bar-pct.warn { color: var(--warn); }

/* KB */
.kb-grid { display: grid; grid-template-columns: 280px 1fr; gap: 16px; padding: 16px 20px 20px; }
.upload-zone {
  border: 1.5px dashed var(--rule-2);
  border-radius: var(--r-lg);
  padding: 24px 20px;
  display: flex; flex-direction: column;
  align-items: center; gap: 8px;
  font-size: 13px;
  color: var(--text-2);
  text-align: center;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  background: var(--paper-tinted);
}
.upload-zone:hover { background: var(--paper-2); border-color: var(--ink); }
.upload-zone .up-ic {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--ink); color: var(--teal);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 4px;
}
.upload-zone .up-h { font-size: 14px; font-weight: 500; color: var(--text); letter-spacing: -0.005em; }
.upload-zone .up-p { font-size: 12px; color: var(--text-2); line-height: 1.45; }
.file-pills { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.file-pill {
  font-family: var(--mono); font-size: 9.5px;
  padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--rule);
  color: var(--text-2);
  background: var(--paper-3);
  letter-spacing: 0.06em;
}

.doc-list { display: flex; flex-direction: column; }
.doc-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 4px;
  border-bottom: 1px dashed var(--rule);
  font-size: 13px;
}
.doc-row:last-child { border-bottom: none; }
.doc-row-ic {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--paper-tinted);
  border: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2);
  flex-shrink: 0;
}
.doc-row-main { flex: 1; min-width: 0; }
.doc-name { color: var(--text); font-weight: 500; letter-spacing: -0.005em; }
.doc-meta { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); margin-top: 2px; letter-spacing: 0.02em; }
.doc-status {
  font-family: var(--mono); font-size: 10px;
  padding: 3px 9px; border-radius: 999px;
  background: var(--teal-soft);
  color: var(--teal-deep);
  border: 1px solid var(--teal-soft-2);
  letter-spacing: 0.06em;
}
.doc-status.warn { background: var(--warn-soft); color: var(--warn); border-color: rgba(181,104,28,0.18); }
.doc-action-btn {
  width: 28px; height: 28px;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3);
  transition: background 0.15s;
}
.doc-action-btn:hover { background: var(--ink-soft); color: var(--text); }

/* AI ask bar */
.ai-query-bar {
  display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--rule-2);
  border-radius: 16px;
  padding: 12px 12px 12px 18px;
  background: var(--ink);
  color: var(--text-on-ink);
  box-shadow: var(--shadow-card);
  position: relative;
  overflow: hidden;
}
.ai-query-bar::before {
  content: ''; position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at right, rgba(21,183,154,0.10) 0%, transparent 60%);
  pointer-events: none;
}
.ai-query-bar-ic {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
  color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  z-index: 1;
}
.ai-query-bar-text { flex: 1; font-size: 13.5px; color: var(--text-on-ink-2); z-index: 1; }
.ai-query-bar-text em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--text-on-ink); }
.ai-ask-btn {
  padding: 9px 18px;
  border-radius: 999px;
  background: var(--teal);
  color: var(--ink);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: -0.005em;
  display: inline-flex; align-items: center; gap: 7px;
  z-index: 1;
}
.ai-ask-btn:hover { background: #1DCBA9; }

/* ============================================================
   ADMIN TAB PAGES — extras
   ============================================================ */

/* User activity table */
.user-table { padding: 4px 8px 12px; }
.user-table-head, .user-table-row {
  display: grid;
  grid-template-columns: 2fr 1.3fr 0.7fr 1fr 1fr;
  align-items: center;
  gap: 14px;
  padding: 10px 12px;
}
.user-table-head {
  font-family: var(--sans);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-3);
  border-bottom: 1px solid var(--rule);
  padding-bottom: 8px;
}
.user-table-row {
  font-size: 13px;
  color: var(--text);
  border-bottom: 1px dashed var(--rule);
  letter-spacing: -0.005em;
}
.user-table-row:last-child { border-bottom: none; }
.user-table-row:hover { background: var(--paper-tinted); }
.user-cell { display: flex; align-items: center; gap: 10px; }
.user-av-tbl {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--ink); color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 500;
  flex-shrink: 0; position: relative;
}
.user-av-tbl::after {
  content: ''; position: absolute; bottom: 0; right: 0;
  width: 8px; height: 8px; border-radius: 50%;
  border: 2px solid var(--paper-3);
}
.user-av-tbl.active::after { background: var(--teal); }
.user-av-tbl.idle::after { background: var(--gold); }
.user-av-tbl.offline::after { background: var(--text-3); }
.user-cell-name { font-weight: 500; }
.user-cell-role { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.user-team { color: var(--text-2); font-size: 12.5px; }
.user-num { font-weight: 500; font-variant-numeric: tabular-nums; }
.user-conf { font-weight: 500; color: var(--positive); font-variant-numeric: tabular-nums; }
.user-conf.warn { color: var(--warn); }
.user-last { color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; }

/* Upload rows */
.upload-row {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 6px;
  border-bottom: 1px dashed var(--rule);
}
.upload-row:last-child { border-bottom: none; }
.upload-row-ic {
  width: 36px; height: 36px; border-radius: 8px;
  background: var(--paper-tinted);
  border: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2); flex-shrink: 0;
}
.upload-row-ic svg { width: 16px; height: 16px; }
.upload-row-main { flex: 1; min-width: 0; }
.upload-row-name { font-size: 13px; font-weight: 500; letter-spacing: -0.005em; }
.upload-row-meta { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.upload-progress {
  margin-top: 8px;
  height: 4px;
  background: var(--paper-2);
  border-radius: 4px;
  overflow: hidden;
}
.upload-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--teal-deep) 0%, var(--teal) 100%);
  border-radius: 4px;
  transition: width 0.4s ease;
}
.upload-pct {
  font-size: 12px; font-weight: 500;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  width: 42px; text-align: right;
}

/* Tips */
.tip-row {

<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useRef, useEffect } = React;


/* ===========================================
   API SERVICE LAYER
   Connects to the SISO Live! backend.
   In development: uses simulated RAG data.
   In production: calls the real API endpoints.
   Toggle via window.SISO_API_BASE_URL
   =========================================== */
const API_BASE = window.SISO_API_BASE_URL || 'https://sisolive.vercel.app';

// Auth token management
const Auth = {
  getToken: () => localStorage.getItem('siso_token'),
  setToken: (t) => localStorage.setItem('siso_token', t),
  clearToken: () => localStorage.removeItem('siso_token'),
  getUser: () => { try { return JSON.parse(localStorage.getItem('siso_user')); } catch { return null; } },
  setUser: (u) => localStorage.setItem('siso_user', JSON.stringify(u)),
};

// Core API caller with auth header
async function apiCall(endpoint, options = {}) {
  const token = Auth.getToken();
  const res = await fetch(`${API_BASE}${endpoint}`, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
      ...options.headers,
    },
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: 'Request failed' }));
    throw new Error(err.error || `HTTP ${res.status}`);
  }
  return res.json();
}

// Auth API
const AuthAPI = {
  login: (email, password) =>
    apiCall('/api/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) }),
  logout: () =>
    apiCall('/api/auth/logout', { method: 'POST' }),
};

// Chat API
const ChatAPI = {
  query: (question) =>
    apiCall('/api/chat/query', { method: 'POST', body: JSON.stringify({ question }) }),
  feedback: (queryId, rating, comment) =>
    apiCall('/api/chat/feedback', { method: 'POST', body: JSON.stringify({ queryId, rating, comment }) }),
};

// Admin API
const AdminAPI = {
  dashboard: () => apiCall('/api/admin/dashboard'),
  topQueries: () => apiCall('/api/admin/analytics/top-queries'),
  escalations: () => apiCall('/api/admin/analytics/escalations'),
  feedback: () => apiCall('/api/admin/analytics/feedback'),
  documents: () => apiCall('/api/admin/documents'),
  uploadDocument: async (formData) => {
    const r = await fetch(`${API_BASE}/api/upload/document`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${Auth.getToken()}` },
      body: formData,
    });
    const data = await r.json().catch(() => ({ error: 'Upload failed' }));
    if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
    return data;
  },
};

/* ===========================================
   RAG SIMULATION DATA
   Used when API_BASE is null (dev/demo mode).
   Claude Code will replace findAnswer() calls
   with real ChatAPI.query() calls in production.
   =========================================== */
const RAG_DATA = [
  { keywords: ['diversity','spend','target','fiscal','fy2026','fy26'], confidence: 97, answer: "AbbVie's supplier diversity spend target is 15% of total procurement by end of FY2026, prioritizing Tier 1 certified minority-owned and women-owned businesses per the 2024 Supplier Inclusion Policy.", source: "Supplier_Inclusion_Policy_2024.pdf", nudge: "Want to explore how this connects to your ESG reporting obligations?" },
  { keywords: ['tier 1','certification','certif','process'], confidence: 94, answer: "Tier 1 supplier certification requires WBENC, NMSDC, or equivalent third-party certification, plus annual attestation through AbbVie's supplier portal. New certifications are reviewed quarterly by the SISO team.", source: "Supplier_Certification_Guide_2024.pdf", nudge: "Curious about the Tier 2 indirect spend requirements too?" },
  { keywords: ['carbon','reduction','measure','methodology'], confidence: 91, answer: "AbbVie measures carbon reduction using Scope 1 and 2 GHG emissions against a 2015 baseline, targeting a 50% absolute reduction by 2030. Progress is tracked quarterly via EHS reporting tools.", source: "Sustainability_Targets_2024.pdf", nudge: "Would you like to explore how supplier carbon data feeds into our Scope 3 calculations?" },
  { keywords: ['esg','reporting','requirement'], confidence: 93, answer: "ESG reporting requirements include annual supplier scorecards, quarterly diversity spend attestation, and participation in the AbbVie Supplier ESG Index. Reports are due within 45 days of quarter close.", source: "ESG_Reporting_Requirements.pdf", nudge: "Want to know which metrics are weighted most heavily in the Supplier ESG Index?" },
  { keywords: ['minority','women','owned','mwbe','wbe','mbe'], confidence: 96, answer: "Minority and women-owned business criteria require active third-party certification (NMSDC, WBENC, or equivalent). Businesses must be 51%+ owned, operated, and controlled by qualifying individuals.", source: "Supplier_Inclusion_Policy_2024.pdf", nudge: "Explore how MWBEs qualify for preferred supplier status at AbbVie." },
  { keywords: ['scope 3','emissions','calculation'], confidence: 62, answer: null, source: null, nudge: null },
  { keywords: ['international','global','supplier','standard'], confidence: 68, answer: null, source: null, nudge: null },
];

function findAnswer(query) {
  const q = query.toLowerCase();
  let best = null, bestScore = 0;
  for (const item of RAG_DATA) {
    const score = item.keywords.filter(k => q.includes(k)).length;
    if (score > bestScore) { bestScore = score; best = item; }
  }
  if (!best || bestScore === 0) return { confidence: 58, answer: null, source: null, nudge: null };
  return best;
}

// Production query handler — uses real API when available, falls back to simulation
async function queryRAG(question) {
  if (API_BASE) {
    try {
      return await ChatAPI.query(question);
    } catch (err) {
      console.error('API query failed, falling back to simulation:', err);
    }
  }
  // Simulate network delay in demo mode
  await new Promise(r => setTimeout(r, 1200 + Math.random() * 600));
  const result = findAnswer(question);
  return {
    answer: result.confidence >= 90 ? result.answer : null,
    nudge: result.nudge,
    confidence: result.confidence,
    confidencePercent: result.confidence,
    shouldEscalate: result.confidence < 90,
    sources: result.source ? [{ filename: result.source, relevanceScore: result.confidence }] : [],
    charCount: result.answer?.length || 0,
  };
}
function ConfidenceArc({ value }) {
  // simple circular conic-gradient arc
  const color = value >= 90 ? 'var(--teal)' : 'var(--warn)';
  const bg = `conic-gradient(${color} ${value * 3.6}deg, var(--paper-2) 0deg)`;
  return (
    <div className="conf-arc" style={{ background: bg }}>
      <div className="conf-arc-inner">{value}</div>
    </div>);

}

function MiniSpark({ data, color = 'var(--ink)' }) {
  const w = 64,h = 22;
  const max = Math.max(...data),min = Math.min(...data);
  const range = max - min || 1;
  const pts = data.map((d, i) => {
    const x = i / (data.length - 1) * w;
    const y = h - (d - min) / range * h;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg width={w} height={h} className="metric-spark" style={{ position: 'absolute', right: 18, bottom: 14 }}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" opacity="0.55" />
      <circle cx={w} cy={h - (data[data.length - 1] - min) / range * h} r="2" fill={color} />
    </svg>);

}

/* ===========================================

function ChatScreen({ user, onAdmin }) {
  const [messages, setMessages] = useState([{
    id: 1, role: 'ai',
    text: `Hello ${user.name.split(' ')[0]}, I'm SISO Live!, your precision learning tool for supplier inclusion and sustainability. What would you like to explore today?`,

  }]);
  const [input, setInput] = useState('');
  const [typing, setTyping] = useState(false);
  const [activeTopic, setActiveTopic] = useState('Supplier inclusion');
  const endRef = useRef();

  useEffect(() => {endRef.current?.scrollIntoView({ behavior: 'smooth' });}, [messages, typing]);

  const topics = [
  { label: 'Supplier inclusion', icon: 'users', count: 42 },
  { label: 'Sustainability', icon: 'leaf', count: 28 },
  { label: 'Compliance', icon: 'cert', count: 17 },
  { label: 'ESG reporting', icon: 'chart', count: 23 }];


  const chips = [
  'What is our supplier diversity spend target?',
  'How do we measure carbon reduction?',
  'What is the Tier 1 certification process?',
  'What are the ESG reporting requirements?'];


  const sendMessage = (text) => {

    setInput('');
    setMessages((m) => [...m, { id: Date.now(), role: 'user', text: q }]);
    setTyping(true);
    queryRAG(q).then((result) => {

      setMessages((m) => [...m, {
        id: Date.now() + 1, role: 'ai',
        text: result.answer || null,
        conf: result.confidencePercent ?? result.confidence,
        source: result.sources?.[0]?.filename || null,
        nudge: result.nudge,
        escalated: result.shouldEscalate || false,
        queryId: result.queryId || null,
        feedback: null, showComment: false, comment: '',
        chars: result.answer ? result.answer.length : null,
      }]);
    }).catch((err) => {
      setTyping(false);
      console.error('Query failed:', err);
    });
  };

  const setFeedback = (id, val, queryId) => {
    setMessages((m) => m.map((msg) =>
      msg.id === id ? { ...msg, feedback: val, showComment: val === 'down' } : msg
    ));
    if (queryId) {
      ChatAPI.feedback(queryId, val, '').catch(err => console.error('Feedback failed:', err));
    }
  };

  const submitComment = (id, queryId, comment) => {
    setMessages((m) => m.map((msg) =>
      msg.id === id ? { ...msg, showComment: false, feedback: 'submitted' } : msg
    ));
    if (queryId) {
      ChatAPI.feedback(queryId, 'down', comment).catch(err => console.error('Feedback failed:', err));
    }
  };

  const updateComment = (id, val) => {
    setMessages((m) => m.map((msg) => msg.id === id ? { ...msg, comment: val } : msg));
  };

  const nowStr = () => {
    const d = new Date();
    return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase();
  };

  return (
    <div className="app-shell">

function AdminUpload() {
  const fileInputRef = React.useRef();
  const [uploads, setUploads] = React.useState([]);
  const [dragging, setDragging] = React.useState(false);

  const handleFiles = async (files) => {
    for (const file of Array.from(files)) {
      const id = Date.now() + Math.random();
      setUploads(u => [...u, { id, name: file.name, status: 'Uploading', pct: 10, error: null }]);
      const fd = new FormData();
      fd.append('file', file);
      try {
        const result = await AdminAPI.uploadDocument(fd);
        setUploads(u => u.map(x => x.id === id
          ? { ...x, status: result.status === 'active' ? 'Indexed' : 'Processing', pct: result.status === 'active' ? 100 : 75, chunkCount: result.chunkCount }
          : x));
      } catch (err) {
        setUploads(u => u.map(x => x.id === id ? { ...x, status: 'Error', pct: 0, error: err.message } : x));
      }
    }
  };

  const onDrop = (e) => {
    e.preventDefault(); setDragging(false);
    handleFiles(e.dataTransfer.files);
  };

  return (
    <>
      <div className="panel">
        <div className="panel-head">
          <div className="panel-title"><span className="panel-title-ic"><Icons.upload /></span>Add to <em>knowledge base</em></div>
          <span className="panel-tag">CHUNKED &amp; EMBEDDED ON UPLOAD</span>
        </div>
        <div className="panel-body" style={{ padding: '20px' }}>
          <input
            ref={fileInputRef}
            type="file"
            accept=".pdf,.csv,.txt"
            multiple
            style={{ display: 'none' }}
            onChange={e => handleFiles(e.target.files)}
          />
          <div
            className={`upload-zone${dragging ? ' dragging' : ''}`}
            style={{ padding: '44px 24px', cursor: 'pointer' }}
            onClick={() => fileInputRef.current?.click()}
            onDragOver={e => { e.preventDefault(); setDragging(true); }}
            onDragLeave={() => setDragging(false)}
            onDrop={onDrop}
          >
            <div className="up-ic"><div style={{ width: 22, height: 22 }}><Icons.upload /></div></div>
            <div className="up-h">Drop files or click to upload</div>
            <div className="up-p">Files are automatically chunked and embedded into the RAG index. Supported types below.</div>
            <div className="file-pills">
              {['PDF', 'CSV', 'TXT'].map(t => <span key={t} className="file-pill">{t}</span>)}
            </div>
          </div>
        </div>
      </div>

      <div className="two-col">
        <div className="panel">
          <div className="panel-head"><div className="panel-title"><span className="panel-title-ic"><Icons.refresh /></span>Recent <em>uploads</em></div><span className="panel-tag">THIS SESSION</span></div>
          <div className="panel-body">
            {uploads.length === 0 && (
              <div style={{ padding: '20px', color: 'var(--text-2)', fontSize: 13 }}>No uploads yet this session.</div>
            )}
            {uploads.map(f =>
              <div key={f.id} className="upload-row">
                <div className="upload-row-ic"><Icons.files /></div>
                <div className="upload-row-main">
                  <div className="upload-row-name">{f.name}</div>
                  <div className="upload-row-meta" style={{ color: f.error ? 'var(--warn)' : undefined }}>
                    {f.error || f.status}{f.chunkCount ? ` · ${f.chunkCount} chunks` : ''}
                  </div>
                  {!f.error && <div className="upload-progress"><div className="upload-progress-fill" style={{ width: `${f.pct}%` }} /></div>}
                </div>
                <span className="upload-pct">{f.error ? '!' : `${f.pct}%`}</span>

            )}

            ['Scope 3 emissions', 72, true]
          ].map(([t, p, w]) =>
            <div key={t} className="bar-row">
              <span className="bar-lbl"><span className={`dot ${w ? 'warn' : ''}`} />{t}</span>
              <div className="bar-track"><div className={`bar-fill ${w ? 'warn' : ''}`} style={{ width: `${p}%` }} /></div>
              <span className={`bar-pct ${w ? 'warn' : ''}`}>{p}%</span>
            </div>
          )}
        </div>
      </div>

      <div className="panel">
        <div className="panel-head"><div className="panel-title"><span className="panel-title-ic"><Icons.alert /></span>Topics needing <em>attention</em></div><span className="panel-tag">BELOW 90% THRESHOLD</span></div>
        <div className="panel-body">
          {[
            ['Scope 3 emissions calculation', 47, 'Add the FY26 methodology PDF and a one-page summary.'],
            ['International supplier standards', 34, 'Coverage is mostly US-centric. Add EU and APAC guidance.'],
            ['Compliance attestations', 18, 'Source doc conflicts with the 2024 handbook. Reconcile.']
          ].map(([t, c, fix]) =>
            <div key={t} className="gap-row" style={{ alignItems: 'flex-start' }}>
              <div className="gap-dot" style={{ marginTop: 6 }} />
              <div style={{ flex: 1 }}>
                <div className="gap-text">{t}</div>
                <div style={{ fontSize: 12, color: 'var(--text-2)', marginTop: 4, lineHeight: 1.5 }}>{fix}</div>
              </div>
              <span className="gap-count">{c} esc</span>
              <span className="gap-action">FIX →</span>
            </div>
          )}
        </div>
      </div>
    </>
  );
}

/* ===========================================
   APP · DO NOT MODIFY
   =========================================== */
function App() {
  const [screen, setScreen] = useState('login');
  const [user, setUser] = useState(null);
  const [firstLogin, setFirstLogin] = useState(true);

  const handleLogin = (u) => {
    setUser(u);
    if (u.role === 'admin') {
      setScreen('admin');
    } else if (u.first_login !== false) {
      setScreen('onboard');
      setFirstLogin(false);
    } else {
      setScreen('chat');
    }
  };

  return (
    <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
      {screen === 'login' && <LoginScreen onLogin={handleLogin} />}
      {screen === 'onboard' && <OnboardScreen user={user} onEnter={() => setScreen('chat')} />}
      {screen === 'chat' && <ChatScreen user={user} onAdmin={() => setScreen('admin')} />}
      {screen === 'admin' && <AdminScreen user={user} onBack={() => setScreen('chat')} />}
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
